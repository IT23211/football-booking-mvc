<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Không tìm thấy trang</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/client-style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card border-0 shadow rounded-4 p-5">
                <div class="text-warning mb-3">
                    <i class="bi bi-compass-fill" style="font-size: 4.5rem;"></i>
                </div>
                <h1 class="display-5 fw-bold">404 - KHÔNG TÌM THẤY TRANG</h1>
                <p class="text-muted mt-2"
                   th:text="${errorMessage != null ? errorMessage : 'Đường dẫn bạn truy cập không tồn tại hoặc đã được di chuyển.'}">
                </p>
                <div class="mt-4">
                    <a th:href="@{/}" class="btn btn-success px-4">
                        <i class="bi bi-arrow-left me-1"></i>Quay về Danh sách sân bóng
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
