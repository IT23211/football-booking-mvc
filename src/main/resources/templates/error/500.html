<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Thông báo hệ thống</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/client-style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4 px-3 px-md-4">
    <div class="row g-4 justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card border rounded-3 shadow-sm bg-white mb-4">
                <div class="card-header bg-light py-3 fw-semibold">
                    <i class="bi bi-gear-wide-connected me-2 text-secondary"></i>Thông Báo Hệ Thống (Mã lỗi 500)
                </div>
                <div class="card-body p-3 p-md-4 text-center">
                    <div class="text-secondary mb-3">
                        <i class="bi bi-gear-wide-connected" style="font-size: 3.5rem;"></i>
                    </div>
                    <h1 class="fs-3 fw-bold text-dark mb-3">THÔNG BÁO HỆ THỐNG</h1>
                    <p class="text-dark mb-2"
                       th:text="${errorMessage != null ? errorMessage : 'Hệ thống đang xử lý yêu cầu hoặc gặp gián đoạn tạm thời. Vui lòng thử lại!'}">
                    </p>
                    <p class="small text-muted mb-0">
                        (Mọi chi tiết kỹ thuật SQL/Java đã được ẩn hoàn toàn nhằm bảo vệ an toàn thông tin hệ thống)
                    </p>
                </div>
                <div class="card-footer bg-white border-top py-3">
                    <div class="d-grid d-sm-flex gap-2 justify-content-sm-end">
                        <a th:href="@{/}" class="btn btn-success py-2 px-3">
                            <i class="bi bi-house-door me-1"></i>Quay lại Trang chủ
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
