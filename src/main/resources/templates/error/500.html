<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Thông báo hệ thống</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/client-style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card border-0 shadow rounded-4 p-5">
                <div class="text-secondary mb-3">
                    <i class="bi bi-gear-wide-connected" style="font-size: 4.5rem;"></i>
                </div>
                <h1 class="h2 fw-bold">THÔNG BÁO HỆ THỐNG</h1>
                <p class="text-muted mt-2"
                   th:text="${errorMessage != null ? errorMessage : 'Hệ thống đang xử lý yêu cầu hoặc gặp gián đoạn tạm thời. Vui lòng thử lại!'}">
                </p>
                <p class="small text-secondary">
                    (Mọi chi tiết kỹ thuật SQL/Java đã được ẩn hoàn toàn nhằm bảo vệ an toàn thông tin hệ thống)
                </p>
                <div class="mt-4">
                    <a th:href="@{/}" class="btn btn-success px-4">
                        <i class="bi bi-house-door me-1"></i>Quay lại Trang chủ
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
