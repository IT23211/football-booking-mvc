<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Từ chối truy cập</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/client-style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card border-0 shadow rounded-4 p-5">
                <div class="text-danger mb-3">
                    <i class="bi bi-shield-slash-fill" style="font-size: 4.5rem;"></i>
                </div>
                <h1 class="display-5 fw-bold text-danger">403 - TỪ CHỐI TRUY CẬP</h1>
                <p class="lead fw-semibold text-dark mt-2"
                   th:text="${errorMessage != null ? errorMessage : 'Bạn không có quyền truy cập khu vực này!'}">
                    Bạn không có quyền truy cập khu vực này!
                </p>
                <p class="text-muted small">
                    Hệ thống bảo mật đa tầng (Defense-in-Depth) đã ghi nhận yêu cầu truy cập trái phép của bạn vào nhật ký an ninh.
                </p>
                <div class="mt-4 d-flex justify-content-center gap-3">
                    <a th:href="@{/}" class="btn btn-success px-4">
                        <i class="bi bi-house-door-fill me-1"></i>Về Trang Chủ
                    </a>
                    <a th:href="@{/booking/my-bookings}" class="btn btn-outline-secondary px-4">
                        <i class="bi bi-calendar2-check me-1"></i>Đơn Đặt Sân Của Tôi
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
