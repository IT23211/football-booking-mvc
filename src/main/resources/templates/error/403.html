<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Từ chối truy cập</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/client-style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4 px-3 px-md-4">
    <div class="row g-4 justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card border rounded-3 shadow-sm bg-white mb-4">
                <div class="card-header bg-light py-3 fw-semibold text-danger">
                    <i class="bi bi-shield-slash-fill me-2"></i>Cảnh Báo Bảo Mật (Mã lỗi 403)
                </div>
                <div class="card-body p-3 p-md-4 text-center">
                    <div class="text-danger mb-3">
                        <i class="bi bi-shield-slash-fill" style="font-size: 3.5rem;"></i>
                    </div>
                    <h1 class="fs-3 fw-bold text-dark mb-3">403 - TỪ CHỐI TRUY CẬP</h1>
                    <p class="fw-medium text-dark mb-2"
                       th:text="${errorMessage != null ? errorMessage : 'Bạn không có quyền truy cập khu vực này!'}">
                        Bạn không có quyền truy cập khu vực này!
                    </p>
                    <p class="small text-muted mb-0">
                        Hệ thống bảo mật đa tầng (Defense-in-Depth) đã ghi nhận yêu cầu truy cập trái phép vào nhật ký an ninh.
                    </p>
                </div>
                <div class="card-footer bg-white border-top py-3">
                    <div class="d-grid d-sm-flex gap-2 justify-content-sm-end">
                        <a th:href="@{/booking/my-bookings}" class="btn btn-outline-secondary py-2 px-3">
                            <i class="bi bi-calendar2-check me-1"></i>Đơn Đặt Sân Của Tôi
                        </a>
                        <a th:href="@{/}" class="btn btn-success py-2 px-3">
                            <i class="bi bi-house-door-fill me-1"></i>Về Trang Chủ
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
