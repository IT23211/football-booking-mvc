<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="sidebar(activeMenu)" class="owner-sidebar p-3">
    <div class="d-flex justify-content-between align-items-center pb-3 mb-3 border-bottom border-secondary">
        <div>
            <div class="d-flex align-items-center gap-2 text-white fw-bold">
                <i class="bi bi-shield-lock-fill text-warning fs-5"></i>
                <span>QUẢN TRỊ CHỦ SÂN</span>
            </div>
            <small class="text-secondary d-block mt-1">Bảo mật phân tách ROLE_OWNER</small>
        </div>
        <button class="btn btn-outline-light d-lg-none py-2 px-3" type="button"
                data-bs-toggle="collapse" data-bs-target="#ownerSidebarMenu"
                aria-controls="ownerSidebarMenu" aria-expanded="false" aria-label="Thu gọn menu">
            <i class="bi bi-list"></i>
        </button>
    </div>

    <div class="collapse d-lg-block" id="ownerSidebarMenu">
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activeMenu == 'bookings' ? 'active' : ''}"
                   th:href="@{/owner/bookings}">
                    <i class="bi bi-calendar-check-fill me-2"></i>Quản lý Đơn Đặt Sân
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activeMenu == 'counter' ? 'active' : ''}"
                   th:href="@{/owner/bookings/counter-new}">
                    <i class="bi bi-cash-coin me-2"></i>Đặt Sân Tại Quầy
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activeMenu == 'fields' ? 'active' : ''}"
                   th:href="@{/owner/fields}">
                    <i class="bi bi-grid-1x2-fill me-2"></i>Quản lý Sân bóng
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activeMenu == 'timeslots' ? 'active' : ''}"
                   th:href="@{/owner/timeslots}">
                    <i class="bi bi-clock-history me-2"></i>Quản lý lịch sân và giá sân
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link"
                    th:classappend="${activeMenu == 'payments' ? 'active' : ''}"
                    th:href="@{/owner/payments}">
                    <i class="bi bi-wallet2 me-2"></i>Quản lý thanh toán
                 </a>
            </li>
            <li class="nav-item">
                <a class="nav-link"
                   th:classappend="${activeMenu == 'customers' ? 'active' : ''}"
                   th:href="@{/owner/customers}">
                    <i class="bi bi-people-fill me-2"></i>Tài khoản khách hàng
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${activeMenu == 'dashboard' ? 'active' : ''}"
                   th:href="@{/owner/dashboard}">
                    <i class="bi bi-bar-chart-line-fill me-2"></i>Thống kê & Doanh thu
                </a>
            </li>
            
            <li class="nav-item">
                <a class="nav-link"
                    th:classappend="${activeMenu == 'promotions' ? 'active' : ''}"
                    th:href="@{/owner/promotions}">
                    <i class="bi bi-ticket-perforated-fill me-2"></i>Quản lý khuyến mại
                </a>
            </li>

        </ul>
    </div>
</div>
</body>
</html>
