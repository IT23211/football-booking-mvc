<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark navbar-pitch sticky-top">
    <div class="container px-3 px-md-4">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" th:href="@{/}">
            <i class="bi bi-dribbble text-warning fs-4"></i>
            <span>FOOTBALL BOOKING VN</span>
        </a>
        <button class="navbar-toggler py-2 px-3" type="button" data-bs-toggle="collapse"
                data-bs-target="#mainNavbar" aria-controls="mainNavbar"
                aria-expanded="false" aria-label="Đóng mở menu điều hướng">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link py-2 px-3" th:href="@{/}">
                        <i class="bi bi-house-door me-1"></i>Danh sách sân bóng
                    </a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link py-2 px-3" th:href="@{/booking/my-bookings}">
                        <i class="bi bi-calendar2-check me-1"></i>Lịch sử đặt sân của tôi
                    </a>
                </li>
                <!-- Chỉ hiển thị nút Quản trị cho tài khoản có quyền ROLE_OWNER -->
                <li class="nav-item" sec:authorize="hasRole('OWNER')">
                    <a class="nav-link text-warning fw-semibold py-2 px-3" th:href="@{/owner/dashboard}">
                        <i class="bi bi-speedometer2 me-1"></i>Khu vực Chủ sân (Owner)
                    </a>
                </li>
            </ul>

            <div class="d-grid d-lg-flex align-items-lg-center gap-2 mt-2 mt-lg-0">
                <!-- Khi chưa đăng nhập -->
                <div sec:authorize="isAnonymous()" class="d-grid d-sm-flex gap-2">
                    <a th:href="@{/auth/login}" class="btn btn-outline-light py-2 px-3">
                        <i class="bi bi-box-arrow-in-right me-1"></i>Đăng nhập
                    </a>
                    <a th:href="@{/auth/register}" class="btn btn-warning py-2 px-3 fw-semibold text-dark">
                        <i class="bi bi-person-plus-fill me-1"></i>Đăng ký OTP
                    </a>
                </div>

                <!-- Khi đã đăng nhập: Bắt buộc Logout qua POST Form kèm CSRF Token -->
                <div sec:authorize="isAuthenticated()" class="d-flex flex-wrap align-items-center justify-content-between gap-2">
                    <span class="text-light small text-truncate" style="max-width: 240px;">
                        <i class="bi bi-person-check-fill text-warning me-1"></i>
                        Xin chào, <strong sec:authentication="name">user</strong>
                        <span sec:authorize="hasRole('OWNER')" class="badge bg-warning text-dark ms-1">CHỦ SÂN</span>
                        <span sec:authorize="hasRole('CUSTOMER')" class="badge bg-info text-dark ms-1">KHÁCH HÀNG</span>
                    </span>
                    <form th:action="@{/auth/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-danger py-2 px-3">
                            <i class="bi bi-box-arrow-right me-1"></i>Đăng xuất
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
