<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Ca đá & Phụ phí Giờ vàng - Owner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/client-style.css}" rel="stylesheet">
    <link th:href="@{/css/admin-style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-3 col-lg-2 p-0">
            <div th:replace="~{fragments/owner-sidebar :: sidebar('timeslots')}"></div>
        </div>

        <main class="col-md-9 col-lg-10 p-4">
            <h3 class="fw-bold mb-4">
                <i class="bi bi-clock-history text-success me-2"></i>Quản Lý Ca Đá & Phụ Phí Giờ Vàng
            </h3>

            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <div class="row g-4">
                <!-- Form Thêm / Cập nhật Khung Giờ -->
                <div class="col-lg-4">
                    <div class="card stat-card bg-white p-4">
                        <h5 class="fw-bold mb-3"
                            th:text="${timeSlotForm.id != null ? 'Cập nhật Ca đá #' + timeSlotForm.id : 'Thêm Khung Giờ Mới'}"></h5>

                        <form th:action="@{/owner/timeslots/save}" th:object="${timeSlotForm}" method="post" novalidate>
                            <input type="hidden" th:field="*{id}">

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Tên ca đá <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{slotName}" class="form-control"
                                       th:classappend="${#fields.hasErrors('slotName')} ? 'is-invalid' : ''"
                                       placeholder="VD: Ca Giờ Vàng 1 (17:30 - 19:00)">
                                <div class="invalid-feedback" th:errors="*{slotName}"></div>
                            </div>

                            <div class="row g-2 mb-3">
                                <div class="col-6">
                                    <label class="form-label fw-semibold">Giờ bắt đầu <span class="text-danger">*</span></label>
                                    <input type="time" th:field="*{startTime}" class="form-control"
                                           th:classappend="${#fields.hasErrors('startTime')} ? 'is-invalid' : ''">
                                    <div class="invalid-feedback" th:errors="*{startTime}"></div>
                                </div>
                                <div class="col-6">
                                    <label class="form-label fw-semibold">Giờ kết thúc <span class="text-danger">*</span></label>
                                    <input type="time" th:field="*{endTime}" class="form-control"
                                           th:classappend="${#fields.hasErrors('endTime')} ? 'is-invalid' : ''">
                                    <div class="invalid-feedback" th:errors="*{endTime}"></div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Phụ phí giờ cao điểm (VNĐ) <span class="text-danger">*</span></label>
                                <input type="number" step="10000" th:field="*{peakHourExtraFee}" class="form-control"
                                       th:classappend="${#fields.hasErrors('peakHourExtraFee')} ? 'is-invalid' : ''"
                                       placeholder="Nhập 0 nếu là ca thường">
                                <div class="invalid-feedback" th:errors="*{peakHourExtraFee}"></div>
                            </div>

                            <div class="form-check form-switch mb-4">
                                <input class="form-check-input" type="checkbox" th:field="*{active}" id="activeSwitch">
                                <label class="form-check-label fw-semibold" for="activeSwitch">Cho phép khách đặt ca này</label>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success fw-bold">
                                    <i class="bi bi-save me-1"></i>Lưu Khung Giờ
                                </button>
                                <a th:if="${timeSlotForm.id != null}" th:href="@{/owner/timeslots}"
                                   class="btn btn-outline-secondary btn-sm">Hủy chế độ sửa</a>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Danh sách các khung giờ -->
                <div class="col-lg-8">
                    <div class="card stat-card bg-white overflow-hidden">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-dark">
                                <tr>
                                    <th>ID</th>
                                    <th>Tên ca đá</th>
                                    <th>Thời gian</th>
                                    <th>Phụ phí giờ vàng</th>
                                    <th>Trạng thái</th>
                                    <th class="text-end">Thao tác</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="ts : ${timeSlots}">
                                    <td class="fw-bold" th:text="'#' + ${ts.id}"></td>
                                    <td class="fw-semibold" th:text="${ts.slotName}"></td>
                                    <td>
                                        <span class="badge bg-light text-dark border"
                                              th:text="${ts.startTime} + ' - ' + ${ts.endTime}"></span>
                                    </td>
                                    <td>
                                        <span th:if="${ts.hasExtraFee()}" class="fw-bold text-danger"
                                              th:text="'+' + ${#numbers.formatDecimal(ts.peakHourExtraFee, 0, 'POINT', 0, 'COMMA')} + ' đ'"></span>
                                        <span th:if="${!ts.hasExtraFee()}" class="text-muted">0 đ (Ca thường)</span>
                                    </td>
                                    <td>
                                        <span th:if="${ts.active}" class="badge bg-success">Đang mở</span>
                                        <span th:if="${!ts.active}" class="badge bg-secondary">Tạm khóa</span>
                                    </td>
                                    <td class="text-end">
                                        <div class="d-inline-flex gap-1">
                                            <a th:href="@{/owner/timeslots(editId=${ts.id})}" class="btn btn-sm btn-outline-primary">
                                                <i class="bi bi-pencil"></i> Sửa
                                            </a>
                                            <form th:action="@{/owner/timeslots/toggle/{id}(id=${ts.id})}" method="post">
                                                <button type="submit" class="btn btn-sm btn-outline-warning text-dark">
                                                    <i class="bi bi-power"></i> Đổi TT
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
