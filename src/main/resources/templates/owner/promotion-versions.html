<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lịch sử phiên bản</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link th:href="@{/css/admin-style.css}" rel="stylesheet"></head>
<body><div class="owner-layout"><aside class="owner-sidebar-wrapper"><div th:replace="~{fragments/owner-sidebar :: sidebar('promotions')}"></div></aside>
<main class="owner-main-content"><div class="container py-4 px-3 px-md-4">
<h1 class="fs-3 fw-bold text-dark mb-3">Lịch sử phiên bản: <span th:text="${promotion.code}"></span></h1>
<div class="card border rounded-3 shadow-sm"><div class="card-body p-0"><div class="table-responsive"><table class="table table-bordered table-hover align-middle mb-0">
<thead class="table-light"><tr><th>Phiên bản</th><th>Tên</th><th>Giảm giá</th><th>Hiệu lực</th><th>Ngày áp dụng</th><th>Người đổi</th><th>Ghi chú</th></tr></thead>
<tbody><tr th:each="v : ${versions}"><td th:text="${v.versionNumber}"></td><td th:text="${v.name}"></td><td th:text="${v.discountType.displayName} + ' ' + ${v.discountValue}"></td><td th:text="${#temporals.format(v.startAt,'dd/MM/yyyy HH:mm')} + ' - ' + ${#temporals.format(v.endAt,'dd/MM/yyyy HH:mm')}"></td><td th:text="${v.applicableDays}"></td><td th:text="${v.changedBy}"></td><td th:text="${v.changeNote}"></td></tr></tbody>
</table></div></div></div>
<a th:href="@{/owner/promotions}" class="btn btn-outline-secondary py-2 px-3 mt-3">Quay lại</a>
</div></main></div></body></html>
