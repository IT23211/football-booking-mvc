<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit ? 'Cập nhật Sân bóng' : 'Thêm mới Sân bóng'}">Form Sân Bóng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/client-style.css}" rel="stylesheet">
    <link th:href="@{/css/admin-style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="owner-layout">
    <aside class="owner-sidebar-wrapper">
        <div th:replace="~{fragments/owner-sidebar :: sidebar('fields')}"></div>
    </aside>

    <main class="flex-grow-1 p-3 p-md-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
            <h1 class="fs-3 fw-bold text-dark mb-0">
                <i class="bi bi-plus-square-fill text-success me-2"></i>
                <span th:text="${isEdit ? 'Cập Nhật Thông Tin Sân Bóng & Lịch Bảo Trì' : 'Thêm Mới Sân Bóng Đá'}"></span>
            </h1>
            <div class="d-grid d-sm-flex gap-2 justify-content-sm-end">
                <a th:href="@{/owner/fields}" class="btn btn-outline-secondary py-2 px-3">
                    <i class="bi bi-arrow-left me-1"></i>Quay lại danh sách
                </a>
            </div>
        </div>

        <div th:if="${successMessage}" class="alert alert-success text-break" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger text-break" th:text="${errorMessage}"></div>

        <div class="row g-4">
            <div class="col-12 col-lg-7">
                <div class="card border rounded-3 shadow-sm bg-white mb-4">
                    <div class="card-header bg-light py-3 fw-semibold">
                        <i class="bi bi-pencil-square text-success me-2"></i>Thông Tin Cấu Hình Sân Bóng
                    </div>

                    <form th:action="@{/owner/fields/save}" th:object="${fieldForm}" method="post"
                          enctype="multipart/form-data" novalidate>
                        <div class="card-body p-3 p-md-4">
                            <input type="hidden" th:field="*{id}">
                            <input type="hidden" th:field="*{existingImageUrl}">

                            <div class="row g-3">
                                <div class="col-12 col-md-4">
                                    <label class="form-label fw-medium">Mã định danh sân <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{fieldCode}" class="form-control text-uppercase"
                                           placeholder="VD: SAN5-A">
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fieldCode')}" th:errors="*{fieldCode}"></div>
                                </div>

                                <div class="col-12 col-md-8">
                                    <label class="form-label fw-medium">Tên sân bóng <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{name}" class="form-control"
                                           placeholder="VD: Sân 5A - Cỏ Nhân Tạo FIFA Pro">
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                                </div>

                                <div class="col-12 col-md-4">
                                    <label class="form-label fw-medium">Loại sân <span class="text-danger">*</span></label>
                                    <select th:field="*{fieldType}" class="form-select">
                                        <option th:each="ft : ${fieldTypes}" th:value="${ft}" th:text="${ft.displayName}"></option>
                                    </select>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fieldType')}" th:errors="*{fieldType}"></div>
                                </div>

                                <div class="col-12 col-md-4">
                                    <label class="form-label fw-medium">Giá gốc / ca 90p (VNĐ) <span class="text-danger">*</span></label>
                                    <input type="number" step="10000" th:field="*{basePricePerSlot}" class="form-control"
                                           placeholder="VD: 250000">
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('basePricePerSlot')}" th:errors="*{basePricePerSlot}"></div>
                                </div>

                                <div class="col-12 col-md-4">
                                    <label class="form-label fw-medium">Trạng thái hoạt động <span class="text-danger">*</span></label>
                                    <select th:field="*{status}" class="form-select">
                                        <option th:each="st : ${fieldStatuses}" th:value="${st}" th:text="${st.displayName}"></option>
                                    </select>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
                                </div>

                                <div class="col-12">
                                    <label class="form-label fw-medium">Mô tả chi tiết sân bóng</label>
                                    <textarea th:field="*{description}" class="form-control" rows="3"
                                              placeholder="Mô tả chất lượng mặt cỏ, hệ thống đèn chiếu sáng, tiện ích đi kèm..."></textarea>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                                </div>

                                <div class="col-12">
                                    <label class="form-label fw-medium">Tải lên ảnh mặt cỏ sân bóng (JPG, PNG, WEBP - Tối đa 5MB)</label>
                                    <input type="file" th:field="*{imageFile}" class="form-control" accept="image/*">
                                    <div th:if="${fieldForm.existingImageUrl != null}" class="mt-3">
                                        <span class="small text-muted d-block mb-1">Ảnh sân hiện tại:</span>
                                        <img th:src="${fieldForm.existingImageUrl}" alt="Current"
                                             class="img-fluid w-100 rounded border"
                                             style="height: 200px; object-fit: cover;">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="card-footer bg-white border-top py-3">
                            <div class="d-grid d-sm-flex gap-2 justify-content-sm-end">
                                <a th:href="@{/owner/fields}" class="btn btn-outline-secondary py-2 px-3">Hủy</a>
                                <button type="submit" class="btn btn-success py-2 px-3 fw-semibold">
                                    <i class="bi bi-save me-1"></i>Lưu Thông Tin Sân Bóng
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Nhật ký bảo trì sân bóng (field_maintenance_logs) -->
            <div class="col-12 col-lg-5" th:if="${isEdit}">
                <div class="card border rounded-3 shadow-sm bg-white mb-4">
                    <div class="card-header bg-light py-3 fw-semibold">
                        <i class="bi bi-tools text-warning me-2"></i>Tạo Lịch Bảo Trì Sân (Khóa Đặt Sân)
                    </div>
                    <form th:action="@{/owner/fields/maintenance}" method="post">
                        <div class="card-body p-3 p-md-4">
                            <input type="hidden" name="fieldId" th:value="${fieldForm.id}">
                            <div class="row g-3">
                                <div class="col-12 col-md-6">
                                    <label class="form-label fw-medium">Từ ngày <span class="text-danger">*</span></label>
                                    <input type="date" name="startDate" class="form-control" required>
                                </div>
                                <div class="col-12 col-md-6">
                                    <label class="form-label fw-medium">Đến ngày <span class="text-danger">*</span></label>
                                    <input type="date" name="endDate" class="form-control" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-medium">Lý do bảo trì mặt cỏ / đèn chiếu sáng <span class="text-danger">*</span></label>
                                    <input type="text" name="reason" class="form-control"
                                           placeholder="VD: Thay hạt cao su & bảo dưỡng đèn pha LED" required>
                                </div>
                            </div>
                        </div>
                        <div class="card-footer bg-white border-top py-3">
                            <div class="d-grid d-sm-flex gap-2 justify-content-sm-end">
                                <button type="submit" class="btn btn-warning py-2 px-3 fw-semibold w-100">
                                    <i class="bi bi-wrench-adjustable me-1"></i>Lưu Lịch Bảo Trì & Chuyển MAINTENANCE
                                </button>
                            </div>
                        </div>
                    </form>
                </div>

                <div class="card border rounded-3 shadow-sm bg-white mb-4">
                    <div class="card-header bg-light py-3 fw-semibold">
                        <i class="bi bi-journal-text text-secondary me-2"></i>Lịch Sử Bảo Trì Của Sân Này
                    </div>
                    <div class="card-body p-3 p-md-4">
                        <div th:if="${#lists.isEmpty(maintenanceLogs)}" class="small text-muted">
                            Chưa có lịch bảo trì nào được ghi nhận.
                        </div>
                        <ul class="list-group list-group-flush small" th:if="${!#lists.isEmpty(maintenanceLogs)}">
                            <li class="list-group-item px-0" th:each="m : ${maintenanceLogs}">
                                <div class="fw-semibold text-dark">
                                    Ngày bảo trì: <span th:text="${#temporals.format(m.maintenanceDate, 'dd/MM/yyyy')}"></span>
                                </div>
                                <div class="text-muted text-break" th:text="${m.reason}"></div>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
