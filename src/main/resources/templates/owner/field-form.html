<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit ? 'Cập nhật Sân bóng' : 'Thêm mới Sân bóng'}">Form Sân Bóng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/client-style.css}" rel="stylesheet">
    <link th:href="@{/css/admin-style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-3 col-lg-2 p-0">
            <div th:replace="~{fragments/owner-sidebar :: sidebar('fields')}"></div>
        </div>

        <main class="col-md-9 col-lg-10 p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold mb-0">
                    <i class="bi bi-plus-square-fill text-success me-2"></i>
                    <span th:text="${isEdit ? 'Cập Nhật Thông Tin Sân Bóng & Lịch Bảo Trì' : 'Thêm Mới Sân Bóng Đá'}"></span>
                </h3>
                <a th:href="@{/owner/fields}" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-left me-1"></i>Quay lại danh sách
                </a>
            </div>

            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <div class="row g-4">
                <div class="col-lg-7">
                    <div class="card stat-card bg-white p-4">
                        <form th:action="@{/owner/fields/save}" th:object="${fieldForm}" method="post"
                              enctype="multipart/form-data" novalidate>
                            <input type="hidden" th:field="*{id}">
                            <input type="hidden" th:field="*{existingImageUrl}">

                            <div class="row g-3 mb-3">
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">Mã định danh sân <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{fieldCode}" class="form-control text-uppercase"
                                           th:classappend="${#fields.hasErrors('fieldCode')} ? 'is-invalid' : ''"
                                           placeholder="VD: SAN-5-A1">
                                    <div class="invalid-feedback" th:errors="*{fieldCode}"></div>
                                </div>

                                <div class="col-md-8">
                                    <label class="form-label fw-semibold">Tên sân bóng <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{name}" class="form-control"
                                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                                           placeholder="VD: Sân A1 - Cỏ Nhân Tạo FIFA Pro (5 người)">
                                    <div class="invalid-feedback" th:errors="*{name}"></div>
                                </div>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">Loại sân <span class="text-danger">*</span></label>
                                    <select th:field="*{fieldType}" class="form-select">
                                        <option th:each="ft : ${fieldTypes}" th:value="${ft}" th:text="${ft.displayName}"></option>
                                    </select>
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">Giá gốc / ca 90p (VNĐ) <span class="text-danger">*</span></label>
                                    <input type="number" step="10000" th:field="*{basePricePerSlot}" class="form-control"
                                           th:classappend="${#fields.hasErrors('basePricePerSlot')} ? 'is-invalid' : ''"
                                           placeholder="VD: 300000">
                                    <div class="invalid-feedback" th:errors="*{basePricePerSlot}"></div>
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">Trạng thái hoạt động <span class="text-danger">*</span></label>
                                    <select th:field="*{status}" class="form-select">
                                        <option th:each="st : ${fieldStatuses}" th:value="${st}" th:text="${st.displayName}"></option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Mô tả chi tiết sân bóng</label>
                                <textarea th:field="*{description}" class="form-control" rows="3"
                                          placeholder="Mô tả chất lượng mặt cỏ, hệ thống đèn chiếu sáng, tiện ích đi kèm..."></textarea>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold">Tải lên ảnh mặt cỏ sân bóng (JPG, PNG, WEBP - Tối đa 5MB)</label>
                                <input type="file" th:field="*{imageFile}" class="form-control" accept="image/*">
                                <div th:if="${fieldForm.existingImageUrl != null}" class="mt-2">
                                    <small class="text-muted d-block mb-1">Ảnh hiện tại:</small>
                                    <img th:src="${fieldForm.existingImageUrl}" alt="Current" class="rounded-3 border"
                                         style="height: 110px; object-fit: cover;">
                                </div>
                            </div>

                            <div class="d-flex justify-content-end gap-2">
                                <a th:href="@{/owner/fields}" class="btn btn-light border px-4">Hủy</a>
                                <button type="submit" class="btn btn-success fw-bold px-4">
                                    <i class="bi bi-save me-1"></i>Lưu Thông Tin Sân Bóng
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Nhật ký bảo trì sân bóng (field_maintenance_logs) -->
                <div class="col-lg-5" th:if="${isEdit}">
                    <div class="card stat-card bg-white p-4 mb-3">
                        <h5 class="fw-bold text-warning mb-3">
                            <i class="bi bi-tools me-2"></i>Tạo Lịch Bảo Trì Sân (Khóa Đặt Sân)
                        </h5>
                        <form th:action="@{/owner/fields/maintenance}" method="post">
                            <input type="hidden" name="fieldId" th:value="${fieldForm.id}">
                            <div class="row g-2 mb-3">
                                <div class="col-6">
                                    <label class="form-label small fw-semibold">Từ ngày:</label>
                                    <input type="date" name="startDate" class="form-control" required>
                                </div>
                                <div class="col-6">
                                    <label class="form-label small fw-semibold">Đến ngày:</label>
                                    <input type="date" name="endDate" class="form-control" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Lý do bảo trì mặt cỏ / đèn chiếu sáng:</label>
                                <input type="text" name="reason" class="form-control"
                                       placeholder="VD: Thay hạt cao su & bảo dưỡng đèn pha LED" required>
                            </div>
                            <button type="submit" class="btn btn-warning fw-bold w-100">
                                <i class="bi bi-wrench-adjustable me-1"></i>Lưu Lịch Bảo Trì & Chuyển MAINTENANCE
                            </button>
                        </form>
                    </div>

                    <div class="card stat-card bg-white p-4">
                        <h6 class="fw-bold mb-3">Lịch sử bảo trì của sân này</h6>
                        <div th:if="${#lists.isEmpty(maintenanceLogs)}" class="text-muted small">
                            Chưa có lịch bảo trì nào được ghi nhận.
                        </div>
                        <ul class="list-group list-group-flush small" th:if="${!#lists.isEmpty(maintenanceLogs)}">
                            <li class="list-group-item px-0" th:each="m : ${maintenanceLogs}">
                                <div class="fw-bold text-dark">
                                    Ngày bảo trì: <span th:text="${#temporals.format(m.maintenanceDate, 'dd/MM/yyyy')}"></span>
                                </div>
                                <div class="text-muted" th:text="${m.reason}"></div>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
