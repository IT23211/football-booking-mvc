
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý khuyến mại - FBS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link th:href="@{/css/client-style.css}" href="../../static/css/client-style.css" rel="stylesheet">
    <link th:href="@{/css/admin-style.css}" href="../../static/css/admin-style.css" rel="stylesheet">
    <link th:href="@{/css/promotions.css}" href="../../static/css/promotions.css" rel="stylesheet">
</head>

<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="owner-layout">
    <aside class="owner-sidebar-wrapper">
        <div th:replace="~{fragments/owner-sidebar :: sidebar('promotions')}"></div>
    </aside>

    <main class="flex-grow-1 p-3 p-md-4">

        <!-- Tiêu đề -->
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
            <div>
                <h1 class="fs-3 fw-bold mb-1">
                    <i class="bi bi-ticket-perforated-fill text-success me-2"></i>
                    Quản lý khuyến mại
                </h1>
                <p class="text-muted mb-0">
                    Quản lý ưu đãi dành cho đặt sân trực tuyến.
                </p>
            </div>
            <button type="button" class="btn btn-success"
                    data-bs-toggle="modal" data-bs-target="#promoModal">
                <i class="bi bi-plus-circle me-1"></i> Thêm khuyến mại
            </button>
        </div>

        <!-- Bộ lọc -->
        <div class="card border shadow-sm mb-4">
            <div class="card-header bg-light fw-semibold">
                <i class="bi bi-funnel-fill text-success me-2"></i>
                Tìm kiếm khuyến mại
            </div>
            <div class="card-body">
                <div class="row g-2">
                    <div class="col-md-6">
                        <input id="keyword" class="form-control"
                               placeholder="Tên hoặc mã khuyến mại">
                    </div>
                    <div class="col-md-4">
                        <select id="statusFilter" class="form-select">
                            <option value="">Tất cả trạng thái</option>
                            <option value="ACTIVE">Đang áp dụng</option>
                            <option value="UPCOMING">Sắp diễn ra</option>
                            <option value="EXPIRED">Hết hạn</option>
                            <option value="STOPPED">Đã ngừng</option>
                        </select>
                    </div>
                    <div class="col-md-2 d-flex gap-2">
                        <button type="button" id="filterBtn"
                                class="btn btn-primary flex-grow-1">Lọc</button>
                        <button type="button" id="clearBtn"
                                class="btn btn-outline-secondary">Xóa</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Danh sách -->
        <div class="card border shadow-sm">
            <div class="card-header bg-light fw-semibold">
                <i class="bi bi-table text-success me-2"></i>
                Danh sách khuyến mại
            </div>
            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Tên / Mã</th>
                            <th>Mức giảm</th>
                            <th>Thời gian hiệu lực</th>
                            <th>Trạng thái</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="promoTable"></tbody>
                </table>
            </div>
        </div>

        <p class="small text-muted mt-3">
            <i class="bi bi-info-circle me-1"></i>
            Chế độ xem thử: dữ liệu lưu trong trình duyệt, chưa kết nối MySQL.
        </p>
    </main>
</div>

<!-- Cửa sổ thêm khuyến mại -->
<div class="modal fade" id="promoModal" tabindex="-1"
     aria-labelledby="promoModalTitle" aria-hidden="true">

    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title fw-bold" id="promoModalTitle">
                    <i class="bi bi-plus-circle text-success me-2"></i>
                    Thêm khuyến mại
                </h5>
                <button type="button" class="btn-close"
                        data-bs-dismiss="modal" aria-label="Đóng"></button>
            </div>

            <!-- Form là vùng cuộn trực tiếp của Bootstrap -->
            <form id="promoForm" class="modal-body">
                    <div class="row g-3">

                        <div class="col-md-6">
                            <label class="form-label">Tên chương trình *</label>
                            <input class="form-control" name="name"
                                   maxlength="150" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Mã khuyến mại *</label>
                            <input class="form-control" name="code"
                                   maxlength="50" required>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Nội dung giới thiệu</label>
                            <textarea class="form-control"
                                      name="description" rows="2"></textarea>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Hình thức giảm *</label>
                            <select class="form-select" name="discountType">
                                <option value="PERCENT">Phần trăm (%)</option>
                                <option value="FIXED">Số tiền (VNĐ)</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Giá trị giảm *</label>
                            <input class="form-control" type="number"
                                   name="discountValue" min="1" step="1" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Bắt đầu *</label>
                            <input class="form-control" type="datetime-local"
                                   name="startAt" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Kết thúc *</label>
                            <input class="form-control" type="datetime-local"
                                   name="endAt" required>
                        </div>

                        <div class="col-12">
                            <label class="form-label d-block">Ngày áp dụng *</label>
                            <div class="d-flex flex-wrap gap-3">
                                <label><input type="checkbox" name="days" value="MON"> T2</label>
                                <label><input type="checkbox" name="days" value="TUE"> T3</label>
                                <label><input type="checkbox" name="days" value="WED"> T4</label>
                                <label><input type="checkbox" name="days" value="THU"> T5</label>
                                <label><input type="checkbox" name="days" value="FRI"> T6</label>
                                <label><input type="checkbox" name="days" value="SAT"> T7</label>
                                <label><input type="checkbox" name="days" value="SUN"> CN</label>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Giờ bắt đầu áp dụng *</label>
                            <input class="form-control" type="time"
                                   name="fromTime" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Giờ kết thúc áp dụng *</label>
                            <input class="form-control" type="time"
                                   name="toTime" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Tổng lượt sử dụng tối đa</label>
                            <input class="form-control" type="number"
                                   name="totalLimit" min="1" step="1"
                                   placeholder="Không giới hạn">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Lượt tối đa mỗi khách</label>
                            <input class="form-control" type="number"
                                   name="perCustomerLimit" min="1" step="1"
                                   placeholder="Không giới hạn">
                        </div>

                    </div>

                    <div id="promoNotice" class="alert alert-danger d-none mt-3 mb-0"
                         role="alert"></div>
            </form>

            <!-- Footer là phần tử ngang cấp với form, không bị cuộn -->
            <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary"
                            data-bs-dismiss="modal">
                        Hủy
                    </button>
                    <button type="submit" form="promoForm" class="btn btn-success fw-semibold px-4">
                        <i class="bi bi-floppy-fill me-1"></i>
                        Lưu khuyến mại
                    </button>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const KEY = "fbs_promotion_ui_demo";
    const form = document.getElementById("promoForm");
    const table = document.getElementById("promoTable");
    const notice = document.getElementById("promoNotice");
    const modal = bootstrap.Modal.getOrCreateInstance(
        document.getElementById("promoModal")
    );

    // Dữ liệu xem thử, chỉ lưu tại trình duyệt.
    let promotions;
    try {
        const saved = JSON.parse(localStorage.getItem(KEY) || "[]");
        promotions = Array.isArray(saved) ? saved : [];
    } catch {
        promotions = [];
    }

    const saveDemo = () =>
        localStorage.setItem(KEY, JSON.stringify(promotions));

    const getStatus = (p) => {
        if (p.stopped) return ["STOPPED", "Đã ngừng", "secondary"];
        const now = Date.now();
        if (now < new Date(p.startAt).getTime())
            return ["UPCOMING", "Sắp diễn ra", "warning"];
        if (now >= new Date(p.endAt).getTime())
            return ["EXPIRED", "Hết hạn", "secondary"];
        return ["ACTIVE", "Đang áp dụng", "success"];
    };

    const formatDate = (s) =>
        new Date(s).toLocaleString("vi-VN", {
            day: "2-digit", month: "2-digit", year: "numeric",
            hour: "2-digit", minute: "2-digit"
        });

    // Tạo phần tử bằng textContent, không chèn HTML từ người nhập.
    function cell(row, text) {
        const td = document.createElement("td");
        td.textContent = text;
        row.appendChild(td);
        return td;
    }

    function render() {
        table.replaceChildren();

        const keyword = document.getElementById("keyword")
            .value.trim().toLocaleLowerCase("vi");
        const filter = document.getElementById("statusFilter").value;

        const list = promotions.filter(p => {
            const status = getStatus(p)[0];
            const matchesText = (p.name + " " + p.code)
                .toLocaleLowerCase("vi").includes(keyword);
            return matchesText && (!filter || filter === status);
        });

        if (!list.length) {
            const tr = document.createElement("tr");
            const td = cell(tr, "Không có chương trình khuyến mại phù hợp.");
            td.colSpan = 5;
            td.className = "text-center text-muted py-4";
            table.appendChild(tr);
            return;
        }

        list.forEach(p => {
            const tr = document.createElement("tr");
            const [status, label, color] = getStatus(p);

            const nameCell = cell(tr, "");
            const name = document.createElement("strong");
            name.textContent = p.name;
            const code = document.createElement("small");
            code.className = "d-block text-muted";
            code.textContent = p.code;
            nameCell.append(name, code);

            cell(tr, p.discountType === "PERCENT"
                ? p.discountValue + "%"
                : Number(p.discountValue).toLocaleString("vi-VN") + " đ");

            cell(tr, formatDate(p.startAt) + " - " + formatDate(p.endAt));

            const statusCell = cell(tr, "");
            const badge = document.createElement("span");
            badge.className = "badge bg-" + color;
            badge.textContent = label;
            statusCell.appendChild(badge);

            const actions = cell(tr, "");
            if (!p.stopped && status !== "EXPIRED") {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "btn btn-sm btn-outline-danger";
                btn.textContent = "Ngừng áp dụng";
                btn.addEventListener("click", () => {
                    if (confirm("Ngừng chương trình này? Không thể kích hoạt lại.")) {
                        p.stopped = true;
                        saveDemo();
                        render();
                    }
                });
                actions.appendChild(btn);
            } else {
                actions.textContent = "—";
            }

            table.appendChild(tr);
        });
    }

    function showError(text) {
        notice.textContent = text;
        notice.classList.remove("d-none");
    }

    form.addEventListener("submit", e => {
        e.preventDefault();
        notice.classList.add("d-none");

        if (!form.reportValidity()) return;

        const f = form.elements;
        const name = f.namedItem("name").value.trim();
        const code = f.namedItem("code").value.trim().toUpperCase();
        const type = f.namedItem("discountType").value;
        const value = Number(f.namedItem("discountValue").value);
        const start = f.namedItem("startAt").value;
        const end = f.namedItem("endAt").value;
        const from = f.namedItem("fromTime").value;
        const to = f.namedItem("toTime").value;
        const days = [...form.querySelectorAll('[name="days"]:checked')]
            .map(x => x.value);

        if (!name || !code) return showError("Nhập tên và mã khuyến mại.");
        if (promotions.some(p => p.code.toUpperCase() === code))
            return showError("Mã khuyến mại đã tồn tại.");
        if (!Number.isInteger(value) || value <= 0 ||
            (type === "PERCENT" && value >= 100))
            return showError("Giá trị giảm không hợp lệ.");
        if (!start || !end || start >= end)
            return showError("Thời gian hiệu lực không hợp lệ.");
        if (!from || !to || from >= to)
            return showError("Khung giờ áp dụng không hợp lệ.");
        if (!days.length)
            return showError("Chọn ít nhất một ngày áp dụng.");

        const total = f.namedItem("totalLimit").value;
        const perCustomer = f.namedItem("perCustomerLimit").value;
        if ([total, perCustomer].some(x =>
            x !== "" && (!Number.isInteger(Number(x)) || Number(x) < 1)))
            return showError("Giới hạn sử dụng phải là số nguyên dương.");

        promotions.push({
            name, code,
            description: f.namedItem("description").value.trim(),
            discountType: type, discountValue: value,
            startAt: start, endAt: end, days,
            fromTime: from, toTime: to,
            totalLimit: total || null,
            perCustomerLimit: perCustomer || null,
            stopped: false
        });

        saveDemo();
        render();
        form.reset();
        modal.hide();
    });

    document.getElementById("filterBtn").addEventListener("click", render);
    document.getElementById("statusFilter").addEventListener("change", render);
    document.getElementById("clearBtn").addEventListener("click", () => {
        document.getElementById("keyword").value = "";
        document.getElementById("statusFilter").value = "";
        render();
    });

    render();
});
</script>
</body>
</html>
