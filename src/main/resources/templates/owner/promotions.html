<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>Quản lý khuyến mại</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/admin-style.css}" rel="stylesheet">
</head>
<body>
<div class="owner-layout">
    <aside class="owner-sidebar-wrapper"><div th:replace="~{fragments/owner-sidebar :: sidebar('promotions')}"></div></aside>
    <main class="owner-main-content"><div class="container py-4 px-3 px-md-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="fs-3 fw-bold text-dark mb-0">Quản lý khuyến mại</h1>
            <div class="d-flex align-items-center gap-2">
                <span th:if="${reauthenticated}" class="badge bg-success py-2 px-3">Đã xác thực mật khẩu (còn hiệu lực trong 5 phút)</span>
                <button th:if="${!reauthenticated}" type="button" class="btn btn-outline-success py-2 px-3" onclick="openReauthModal()">Xác thực mật khẩu quản trị</button>
                <a class="btn btn-success py-2 px-3" th:href="@{/owner/promotions/new}"><i class="bi bi-plus-lg me-1"></i>Tạo khuyến mại</a>
            </div>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div class="card border rounded-3 shadow-sm mb-4">
            <div class="card-header bg-light py-3 fw-semibold">Tìm kiếm & lọc</div>
            <div class="card-body p-3 p-md-4">
                <form method="get" class="row g-3 align-items-end">
                    <div class="col-12 col-md-6"><label class="form-label fw-medium">Mã hoặc tên khuyến mại</label><input class="form-control" name="keyword" th:value="${keyword}"></div>
                    <div class="col-12 col-md-4"><label class="form-label fw-medium">Trạng thái</label>
                        <select class="form-select" name="status"><option value="">Tất cả</option><option th:each="st : ${statuses}" th:value="${st}" th:text="${st.displayName}" th:selected="${st == status}"></option></select>
                    </div>
                    <div class="col-12 col-md-2"><button class="btn btn-primary py-2 px-3 w-100">Lọc</button></div>
                </form>
            </div>
        </div>
        <div class="card border rounded-3 shadow-sm">
            <div class="card-body p-0"><div class="table-responsive"><table class="table table-bordered table-hover align-middle mb-0">
                <thead class="table-light"><tr><th>Mã</th><th>Tên</th><th>Loại</th><th>Hiệu lực</th><th>Trạng thái</th><th>Lượt dùng</th><th class="text-center">Thao tác</th></tr></thead>
                <tbody>
                <tr th:each="p : ${promotions}">
                    <td class="fw-semibold text-break" th:text="${p.code}"></td><td th:text="${p.name}"></td>
                    <td>
                        <strong th:if="${p.discountType.name() == 'PERCENTAGE'}"
                                th:text="${#numbers.formatDecimal(p.discountValue, 0, 'POINT', 0, 'COMMA')} + '%'"></strong>
                        <strong th:if="${p.discountType.name() == 'FIXED_AMOUNT'}"
                                th:text="${#numbers.formatDecimal(p.discountValue, 0, 'POINT', 0, 'COMMA')} + 'đ'"></strong>
                    </td>
                    <td th:text="${#temporals.format(p.startAt,'dd/MM/yyyy HH:mm')} + ' - ' + ${#temporals.format(p.endAt,'dd/MM/yyyy HH:mm')}"></td>
                    <td class="text-center">
                        <span th:if="${p.displayStatus.name() == 'ACTIVE'}" class="badge bg-success" th:text="${p.displayStatus.displayName}">Đang áp dụng</span>
                        <span th:if="${p.displayStatus.name() == 'UPCOMING'}" class="badge bg-primary" th:text="${p.displayStatus.displayName}">Sắp diễn ra</span>
                        <span th:if="${p.displayStatus.name() == 'ENDED'}" class="badge bg-secondary" th:text="${p.displayStatus.displayName}">Đã kết thúc</span>
                        <span th:if="${p.displayStatus.name() == 'STOPPED'}" class="badge bg-danger" th:text="${p.displayStatus.displayName}">Đã ngừng áp dụng</span>
                    </td>
                    <td class="text-end" th:text="${p.usedCount} + ' / ' + (${p.maxTotalUses} ?: '∞')"></td>
                    <td class="text-center">
                        <div class="promo-action-row">
                        <a class="btn btn-sm btn-outline-secondary py-2 px-2" th:href="@{/owner/promotions/{id}/versions(id=${p.id})}">Lịch sử</a>
                        <a class="btn btn-sm btn-outline-primary py-2 px-2" th:href="@{/owner/promotions/{id}/edit(id=${p.id})}">Sửa</a>
                        <button type="button" class="btn btn-sm btn-warning py-2 px-2"
                                th:disabled="${p.stopped}"
                                th:data-id="${p.id}" th:data-code="${p.code}"
                                onclick="openActionModal('stop', this.dataset.id, this.dataset.code)">Ngừng</button>
                        <button type="button" class="btn btn-sm btn-danger py-2 px-2"
                                th:data-id="${p.id}" th:data-code="${p.code}"
                                onclick="openActionModal('delete', this.dataset.id, this.dataset.code)">Xóa</button>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(promotions)}"><td colspan="7" class="text-center text-muted py-4">Chưa có khuyến mại</td></tr>
                </tbody>
            </table></div></div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<div id="actionModal" class="promo-modal" aria-hidden="true">
    <div class="promo-modal-backdrop" onclick="closePromoModal('actionModal')"></div>
    <div class="promo-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="actionModalTitle">
        <form id="promotionActionForm" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="promo-modal-header">
                <h2 id="actionModalTitle" class="fs-5 fw-semibold mb-0">Xác nhận hành động</h2>
                <button type="button" class="promo-modal-close" onclick="closePromoModal('actionModal')" aria-label="Đóng">&times;</button>
            </div>
            <div class="promo-modal-body">
                <p id="actionWarning" class="text-break"></p>
                <label class="form-label fw-medium" for="actionPassword">Mật khẩu quản trị hiện tại</label>
                <input id="actionPassword" type="password" name="currentPassword" class="form-control" autocomplete="current-password" required>
            </div>
            <div class="promo-modal-footer">
                <button type="button" class="btn btn-outline-secondary py-2 px-3" onclick="closePromoModal('actionModal')">Hủy</button>
                <button id="actionConfirmButton" type="submit" class="btn btn-danger py-2 px-3">Xác nhận</button>
            </div>
        </form>
    </div>
</div>
<div id="reauthModal" class="promo-modal" aria-hidden="true">
    <div class="promo-modal-backdrop" onclick="closePromoModal('reauthModal')"></div>
    <div class="promo-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="reauthModalTitle">
        <div class="promo-modal-header">
            <h2 id="reauthModalTitle" class="fs-5 fw-semibold mb-0">Xác thực mật khẩu quản trị</h2>
            <button type="button" class="promo-modal-close" onclick="closePromoModal('reauthModal')" aria-label="Đóng">&times;</button>
        </div>
        <div class="promo-modal-body">
            <label class="form-label fw-medium" for="reauthPassword">Mật khẩu hiện tại</label>
            <input id="reauthPassword" type="password" class="form-control" autocomplete="current-password">
            <div id="reauthMessage" class="small mt-2"></div>
        </div>
        <div class="promo-modal-footer">
            <button type="button" class="btn btn-outline-secondary py-2 px-3" onclick="closePromoModal('reauthModal')">Hủy</button>
            <button type="button" class="btn btn-success py-2 px-3" onclick="submitReauth()">Xác thực</button>
        </div>
    </div>
</div>
<script>
function openActionModal(action, id, code) {
    const stop = action === 'stop';
    document.getElementById('promotionActionForm').action = '/owner/promotions/' + id + '/' + action;
    document.getElementById('actionModalTitle').textContent = stop ? 'Ngừng áp dụng khuyến mại' : 'Xóa khuyến mại';
    document.getElementById('actionWarning').textContent = stop
        ? 'Xác nhận ngừng áp dụng chương trình [' + code + ']? Chương trình đã ngừng sẽ không thể kích hoạt lại.'
        : 'Xác nhận xóa chương trình [' + code + ']? Hành động này không thể hoàn tác.';
    const confirmButton = document.getElementById('actionConfirmButton');
    confirmButton.textContent = stop ? 'Ngừng áp dụng' : 'Xóa';
    confirmButton.className = stop ? 'btn btn-warning py-2 px-3' : 'btn btn-danger py-2 px-3';
    document.getElementById('actionPassword').value = '';
    openPromoModal('actionModal');
}
function openReauthModal() { openPromoModal('reauthModal'); }
function openPromoModal(id) {
    const modal = document.getElementById(id);
    modal.classList.add('show');
    modal.setAttribute('aria-hidden', 'false');
}
function closePromoModal(id) {
    const modal = document.getElementById(id);
    modal.classList.remove('show');
    modal.setAttribute('aria-hidden', 'true');
}
async function submitReauth() {
    const password = document.getElementById('reauthPassword').value;
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;
    const csrfToken = document.querySelector('meta[name="_csrf"]').content;
    const response = await fetch('/owner/promotions/reauth', {
        method: 'POST',
        headers: {'Content-Type':'application/x-www-form-urlencoded', [csrfHeader]:csrfToken},
        body: new URLSearchParams({password})
    });
    const data = await response.json();
    const message = document.getElementById('reauthMessage');
    message.textContent = data.message;
    message.className = data.success ? 'text-success small mt-2' : 'text-danger small mt-2';
    if (data.success) setTimeout(() => window.location.reload(), 300);
}
</script>
</body>
</html>
