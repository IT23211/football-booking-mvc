<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch sử đặt sân của tôi - Football Booking VN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/client-style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-1">
                <i class="bi bi-calendar2-check-fill text-success me-2"></i>Lịch Sử Đặt Sân Của Tôi
            </h3>
            <p class="text-muted small mb-0">Bảo vệ chính chủ chống tấn công IDOR - Chỉ hiển thị và cho phép hủy đơn của chính bạn</p>
        </div>
        <a th:href="@{/}" class="btn btn-success fw-semibold">
            <i class="bi bi-plus-circle me-1"></i>Đặt sân mới
        </a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>Mã đơn</th>
                    <th>Sân bóng</th>
                    <th>Ngày đá</th>
                    <th>Khung giờ</th>
                    <th>Tổng tiền</th>
                    <th>Thanh toán</th>
                    <th>Trạng thái</th>
                    <th class="text-end">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(bookings)}">
                    <td colspan="8" class="text-center py-5 text-muted">
                        <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                        Bạn chưa có đơn đặt sân nào.
                    </td>
                </tr>
                <tr th:each="b : ${bookings}">
                    <td>
                        <a th:href="@{/booking/result/{id}(id=${b.id})}"
                           class="fw-bold text-success text-decoration-none"
                           th:text="${b.bookingCode}"></a>
                    </td>
                    <td>
                        <div class="fw-semibold" th:text="${b.field.name}"></div>
                        <small class="text-muted" th:text="${b.field.fieldType.displayName}"></small>
                    </td>
                    <td class="fw-semibold" th:text="${#temporals.format(b.bookingDate, 'dd/MM/yyyy')}"></td>
                    <td th:text="${b.timeSlot.slotName}"></td>
                    <td class="fw-bold text-danger"
                        th:text="${#numbers.formatDecimal(b.totalPrice, 0, 'POINT', 0, 'COMMA')} + ' đ'"></td>
                    <td><span class="badge bg-light text-dark border" th:text="${b.paymentMethod}"></span></td>
                    <td>
                        <span class="badge" th:classappend="${b.status.badgeClass}" th:text="${b.status.displayName}"></span>
                    </td>
                    <td class="text-end">
                        <div class="d-inline-flex gap-1">
                            <a th:href="@{/booking/result/{id}(id=${b.id})}" class="btn btn-sm btn-outline-primary">
                                <i class="bi bi-qr-code"></i> Vé QR
                            </a>

                            <form th:if="${b.status.name() != 'CANCELLED' and b.status.name() != 'COMPLETED'}"
                                  th:action="@{/booking/cancel/{id}(id=${b.id})}"
                                  method="post"
                                  onsubmit="return confirm('Bạn có chắc chắn muốn hủy đơn đặt sân này không?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-x-circle"></i> Hủy đơn
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
