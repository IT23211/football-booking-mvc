<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cổng Thanh Toán VNPay Sandbox (Demo Local)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/client-style.css}" rel="stylesheet">
</head>
<body>
<div class="container py-4 px-3 px-md-4">
    <div class="row g-4 justify-content-center">
        <div class="col-12 col-md-9 col-lg-7">
            <h1 class="fs-3 fw-bold text-dark mb-3 text-center">
                <i class="bi bi-credit-card-2-back-fill text-primary me-2"></i>Cổng Thanh Toán VNPay Sandbox
            </h1>

            <div class="card border rounded-3 shadow-sm bg-white mb-4">
                <div class="card-header bg-light py-3 fw-semibold d-flex justify-content-between align-items-center">
                    <span><i class="bi bi-shield-lock-fill text-primary me-2"></i>Xác Thực Chữ Ký Số HMAC-SHA512</span>
                    <span class="badge bg-warning text-dark">SANDBOX MODE</span>
                </div>

                <form th:action="@{/payment/mock-vnpay/submit}" method="post">
                    <div class="card-body p-3 p-md-4">
                        <div th:if="${validRequestSignature}" class="alert alert-success small d-flex align-items-center">
                            <i class="bi bi-patch-check-fill me-2 fs-5"></i>
                            <div>Chữ ký số <code>vnp_SecureHash (HMAC-SHA512)</code> của yêu cầu thanh toán hợp lệ!</div>
                        </div>

                        <div class="row g-3 align-items-center mb-3">
                            <div class="col-12 col-md-7">
                                <div class="p-3 bg-light rounded-3 border">
                                    <div class="mb-2">
                                        <span class="small text-muted">Mã giao dịch tham chiếu (vnp_TxnRef):</span>
                                        <div class="fw-bold text-primary text-break" th:text="${vnpParams['vnp_TxnRef']}"></div>
                                    </div>
                                    <div class="mb-2">
                                        <span class="small text-muted">Nội dung thanh toán:</span>
                                        <div class="fw-medium text-break" th:text="${vnpParams['vnp_OrderInfo']}"></div>
                                    </div>
                                    <div>
                                        <span class="small text-muted">Tổng tiền thanh toán (100%):</span>
                                        <div class="fs-5 fw-bold text-danger"
                                             th:text="${#numbers.formatDecimal(amountVnd, 0, 'POINT', 0, 'COMMA')} + ' VNĐ'"></div>
                                    </div>
                                </div>
                            </div>

                            <div class="col-12 col-md-5 text-center">
                                <div th:if="${qrBase64 != null}" class="border rounded-3 p-3 bg-white d-inline-block">
                                    <img th:src="${qrBase64}" alt="VietQR / VNPay QR" class="img-fluid rounded" style="max-width: 165px;">
                                    <div class="small text-muted mt-1">Quét QR VNPay / VietQR Demo</div>
                                </div>
                            </div>
                        </div>

                        <input type="hidden" name="vnp_TxnRef" th:value="${vnpParams['vnp_TxnRef']}">
                        <input type="hidden" name="vnp_Amount" th:value="${vnpParams['vnp_Amount']}">

                        <div class="mb-2">
                            <label class="form-label fw-medium">Chọn Ngân hàng giả lập thanh toán</label>
                            <select name="bankCode" class="form-select">
                                <option value="NCB">Ngân hàng NCB (Thẻ ATM Nội địa Sandbox)</option>
                                <option value="VCB">Ngân hàng Vietcombank</option>
                                <option value="MBBANK">Ngân hàng Quân Đội (MB Bank - VietQR)</option>
                                <option value="VNPAYQR">Ví điện tử VNPay QR</option>
                            </select>
                        </div>
                    </div>

                    <div class="card-footer bg-white border-top py-3">
                        <div class="d-grid d-sm-flex gap-2 justify-content-sm-end">
                            <button type="submit" name="responseCode" value="24" class="btn btn-outline-danger py-2 px-3">
                                <i class="bi bi-x-circle me-1"></i>Giả lập Khách hủy giao dịch (Mã 24)
                            </button>
                            <button type="submit" name="responseCode" value="00" class="btn btn-success py-2 px-3 fw-semibold">
                                <i class="bi bi-check2-circle me-1"></i>Xác nhận Thanh toán 100% Thành công (Mã 00)
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
