<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập hệ thống - Football Booking VN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/client-style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-header bg-success text-white text-center py-4">
                    <i class="bi bi-shield-lock-fill fs-1 text-warning"></i>
                    <h4 class="fw-bold mb-1 mt-2">ĐĂNG NHẬP HỆ THỐNG</h4>
                    <p class="small mb-0 opacity-75">Quản lý & Đặt sân bóng đá trực tuyến an toàn</p>
                </div>

                <div class="card-body p-4">
                    <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
                        <div th:text="${errorMessage}"></div>
                    </div>

                    <div th:if="${successMessage}" class="alert alert-success d-flex align-items-center" role="alert">
                        <i class="bi bi-check-circle-fill me-2 fs-5"></i>
                        <div th:text="${successMessage}"></div>
                    </div>

                    <form th:action="@{/auth/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Tên đăng nhập</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-person-fill text-success"></i></span>
                                <input type="text" name="username" class="form-control"
                                       placeholder="Nhập username (VD: khachhang1 hoặc owner)" required autofocus>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Mật khẩu</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-key-fill text-success"></i></span>
                                <input type="password" name="password" class="form-control"
                                       placeholder="Nhập mật khẩu" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-success w-100 py-2 fw-bold">
                            <i class="bi bi-box-arrow-in-right me-1"></i>ĐĂNG NHẬP NGAY
                        </button>
                    </form>

                    <hr class="my-4">

                    <div class="bg-light rounded-3 p-3 small border">
                        <div class="fw-bold text-secondary mb-1">
                            <i class="bi bi-info-circle-fill text-success me-1"></i>Tài khoản mẫu chạy thử (DataInitializer):
                        </div>
                        <div>• <strong>Chủ sân (Owner):</strong> <code>owner</code> / <code>123456aA@</code></div>
                        <div>• <strong>Khách hàng 1:</strong> <code>khachhang1</code> / <code>123456aA@</code></div>
                        <div>• <strong>Khách hàng 2:</strong> <code>khachhang2</code> / <code>123456aA@</code></div>
                    </div>

                    <div class="text-center mt-3 small">
                        Chưa có tài khoản khách hàng?
                        <a th:href="@{/auth/register}" class="fw-bold text-success text-decoration-none">
                            Đăng ký nhận mã OTP qua Email ngay
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
