<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập hệ thống - Football Booking VN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/client-style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="auth-page-wrapper auth-bg-login">
    <div class="container py-4 px-3 px-md-4">
        <div class="row g-4 justify-content-center">
            <div class="col-12 col-md-8 col-lg-5">
                <div class="auth-title-box border rounded-3 shadow-sm p-3 mb-3 text-center">
                    <h1 class="fs-3 fw-bold text-dark mb-1">
                        <i class="bi bi-shield-lock-fill text-success me-2"></i>Đăng Nhập Hệ Thống
                    </h1>
                    <div class="small text-muted">Đặt sân bóng đá trực tuyến &amp; Quản trị lịch sân</div>
                </div>

                <div class="card border rounded-3 shadow-sm bg-white mb-4 auth-card-smooth">
                    <div class="card-header bg-light py-3 fw-semibold d-flex justify-content-between align-items-center">
                        <span><i class="bi bi-person-check-fill text-success me-2"></i>Thông Tin Tài Khoản</span>
                        <a th:href="@{/auth/forgot-password}" class="small text-success fw-semibold text-decoration-none">
                            <i class="bi bi-key-fill me-1"></i>Quên mật khẩu?
                        </a>
                    </div>

                    <form th:action="@{/auth/login}" method="post" id="loginForm">
                        <div class="card-body p-3 p-md-4">
                            <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center" role="alert">
                                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                                <div class="text-break" th:text="${errorMessage}"></div>
                            </div>

                            <div th:if="${successMessage}" class="alert alert-success d-flex align-items-center" role="alert">
                                <i class="bi bi-check-circle-fill me-2"></i>
                                <div class="text-break" th:text="${successMessage}"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-medium">Tên đăng nhập <span class="text-danger">*</span></label>
                                <input type="text" name="username" id="usernameInput" class="form-control"
                                       placeholder="Nhập username (VD: khachhang1 hoặc owner)" required autofocus>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-medium">Mật khẩu <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <input type="password" name="password" id="passwordInput" class="form-control"
                                           placeholder="Nhập mật khẩu" required>
                                    <button type="button" class="btn btn-outline-secondary px-3" id="togglePasswordBtn"
                                            title="Hiện/Ẩn mật khẩu">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                                <div class="d-flex justify-content-end mt-2">
                                    <a th:href="@{/auth/forgot-password}" class="small text-success text-decoration-none fw-medium">
                                        Khôi phục mật khẩu qua Email OTP &rarr;
                                    </a>
                                </div>
                            </div>

                            <div class="p-3 border rounded-3 bg-light small text-muted">
                                <div class="fw-semibold text-dark mb-2">
                                    <i class="bi bi-lightning-charge-fill text-success me-1"></i>Chạm để điền nhanh tài khoản mẫu:
                                </div>
                                <div class="row g-2">
                                    <div class="col-12 col-sm-4">
                                        <button type="button" class="btn btn-sm btn-white border w-100 text-start quick-account-btn py-2 px-2"
                                                onclick="fillDemoAccount('owner', '123456aA@')">
                                            <div class="fw-semibold text-dark text-truncate"><i class="bi bi-person-badge text-success me-1"></i>Chủ sân</div>
                                            <div class="small text-muted text-truncate">owner</div>
                                        </button>
                                    </div>
                                    <div class="col-12 col-sm-4">
                                        <button type="button" class="btn btn-sm btn-white border w-100 text-start quick-account-btn py-2 px-2"
                                                onclick="fillDemoAccount('khachhang1', '123456aA@')">
                                            <div class="fw-semibold text-dark text-truncate"><i class="bi bi-person text-primary me-1"></i>Khách 1</div>
                                            <div class="small text-muted text-truncate">khachhang1</div>
                                        </button>
                                    </div>
                                    <div class="col-12 col-sm-4">
                                        <button type="button" class="btn btn-sm btn-white border w-100 text-start quick-account-btn py-2 px-2"
                                                onclick="fillDemoAccount('khachhang2', '123456aA@')">
                                            <div class="fw-semibold text-dark text-truncate"><i class="bi bi-person text-primary me-1"></i>Khách 2</div>
                                            <div class="small text-muted text-truncate">khachhang2</div>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="card-footer bg-white border-top py-3">
                            <div class="d-grid d-sm-flex gap-2 justify-content-sm-end">
                                <a th:href="@{/auth/register}" class="btn btn-outline-success py-2 px-3">
                                    <i class="bi bi-person-plus me-1"></i>Đăng ký nhận OTP
                                </a>
                                <button type="submit" class="btn btn-success py-2 px-3 fw-semibold" id="loginSubmitBtn">
                                    <i class="bi bi-box-arrow-in-right me-1"></i>Đăng nhập ngay
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function fillDemoAccount(username, password) {
        const userEl = document.getElementById('usernameInput');
        const passEl = document.getElementById('passwordInput');
        if (userEl && passEl) {
            userEl.value = username;
            passEl.value = password;
            userEl.focus();
        }
    }

    document.getElementById('togglePasswordBtn')?.addEventListener('click', function () {
        const input = document.getElementById('passwordInput');
        const icon = this.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'bi bi-eye-slash';
        } else {
            input.type = 'password';
            icon.className = 'bi bi-eye';
        }
    });

    document.getElementById('loginForm')?.addEventListener('submit', function () {
        const btn = document.getElementById('loginSubmitBtn');
        if (btn) {
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Đang đăng nhập...';
        }
    });
</script>
</body>
</html>
