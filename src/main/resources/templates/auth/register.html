<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký Khách hàng &amp; Xác thực Email OTP - Football Booking VN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/client-style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="auth-page-wrapper auth-bg-register">
    <div class="container py-4 px-3 px-md-4">
        <div class="row g-4 justify-content-center">
            <div class="col-12 col-md-9 col-lg-6">
                <div class="auth-title-box border rounded-3 shadow-sm p-3 mb-3 text-center">
                    <h1 class="fs-3 fw-bold text-dark mb-1">
                        <i class="bi bi-envelope-check-fill text-success me-2"></i>Đăng Ký Tài Khoản Khách Hàng
                    </h1>
                    <div class="small text-muted">Kích hoạt bảo mật qua mã xác thực OTP 6 chữ số gửi về Email</div>
                </div>

                <div class="card border rounded-3 shadow-sm bg-white mb-4 auth-card-smooth">
                    <div class="card-header bg-light py-3 fw-semibold d-flex justify-content-between align-items-center">
                        <span><i class="bi bi-person-plus-fill text-success me-2"></i>Nhập Thông Tin &amp; Nhận Mã OTP 6 Số</span>
                        <a th:href="@{/auth/forgot-password}" class="small text-success fw-semibold text-decoration-none">
                            <i class="bi bi-key-fill me-1"></i>Quên mật khẩu?
                        </a>
                    </div>

                    <form th:action="@{/auth/register}" th:object="${registerForm}" method="post" id="registerForm" novalidate>
                        <div class="card-body p-3 p-md-4">
                            <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center">
                                <i class="bi bi-exclamation-octagon-fill me-2"></i>
                                <div class="text-break" th:text="${errorMessage}"></div>
                            </div>

                            <div class="row g-3">
                                <div class="col-12 col-md-6">
                                    <label class="form-label fw-medium">Tên đăng nhập <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{username}" class="form-control"
                                           placeholder="Từ 4-30 ký tự (VD: nguyenvana)" autofocus>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label class="form-label fw-medium">Họ và tên đầy đủ <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{fullName}" class="form-control"
                                           placeholder="VD: Nguyễn Văn A">
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                                </div>

                                <div class="col-12">
                                    <label class="form-label fw-medium">Địa chỉ Email (Nhận mã OTP 6 số &amp; Vé đặt sân) <span class="text-danger">*</span></label>
                                    <input type="email" th:field="*{email}" class="form-control"
                                           placeholder="VD: nguyenvana@gmail.com">
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                                    <div class="small text-muted mt-1">
                                        Mã xác thực OTP 6 chữ số có hiệu lực 3 phút sẽ được gửi trực tiếp về Email này.
                                    </div>
                                </div>

                                <div class="col-12">
                                    <label class="form-label fw-medium">Số điện thoại Việt Nam (Liên hệ nhận sân) <span class="text-danger">*</span></label>
                                    <input type="tel" th:field="*{phone}" class="form-control" maxlength="10"
                                           placeholder="10 chữ số đầu 03, 05, 07, 08, 09 (VD: 0912345678)">
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label class="form-label fw-medium">Mật khẩu <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <input type="password" th:field="*{password}" id="regPassword" class="form-control"
                                               placeholder="Tối thiểu 6 ký tự">
                                        <button type="button" class="btn btn-outline-secondary px-3 toggle-pwd" data-target="regPassword">
                                            <i class="bi bi-eye"></i>
                                        </button>
                                    </div>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label class="form-label fw-medium">Nhập lại mật khẩu <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <input type="password" th:field="*{confirmPassword}" id="regConfirmPassword" class="form-control"
                                               placeholder="Xác nhận mật khẩu">
                                        <button type="button" class="btn btn-outline-secondary px-3 toggle-pwd" data-target="regConfirmPassword">
                                            <i class="bi bi-eye"></i>
                                        </button>
                                    </div>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                                    <div class="small mt-1 d-none" id="passwordMatchHint"></div>
                                </div>
                            </div>
                        </div>

                        <div class="card-footer bg-white border-top py-3">
                            <div class="d-grid d-sm-flex gap-2 justify-content-sm-end">
                                <a th:href="@{/auth/login}" class="btn btn-outline-secondary py-2 px-3">
                                    Đã có tài khoản? Đăng nhập
                                </a>
                                <button type="submit" class="btn btn-success py-2 px-3 fw-semibold" id="registerSubmitBtn">
                                    <i class="bi bi-send-check-fill me-1"></i>Đăng ký &amp; Nhận mã OTP (3 phút)
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.querySelectorAll('.toggle-pwd').forEach(function (btn) {
        btn.addEventListener('click', function () {
            const targetId = this.getAttribute('data-target');
            const input = document.getElementById(targetId);
            const icon = this.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'bi bi-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'bi bi-eye';
            }
        });
    });

    const pwd = document.getElementById('regPassword');
    const confirmPwd = document.getElementById('regConfirmPassword');
    const matchHint = document.getElementById('passwordMatchHint');

    function checkPasswordMatch() {
        if (!pwd || !confirmPwd || !matchHint) return;
        if (!confirmPwd.value) {
            matchHint.className = 'small mt-1 d-none';
            return;
        }
        if (pwd.value === confirmPwd.value) {
            matchHint.className = 'small mt-1 text-success fw-medium';
            matchHint.innerHTML = '<i class="bi bi-check-circle-fill me-1"></i>Mật khẩu xác nhận khớp';
        } else {
            matchHint.className = 'small mt-1 text-danger';
            matchHint.innerHTML = '<i class="bi bi-exclamation-circle-fill me-1"></i>Mật khẩu xác nhận chưa khớp';
        }
    }

    pwd?.addEventListener('input', checkPasswordMatch);
    confirmPwd?.addEventListener('input', checkPasswordMatch);

    document.getElementById('registerForm')?.addEventListener('submit', function () {
        const btn = document.getElementById('registerSubmitBtn');
        if (btn) {
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Đang gửi mã OTP...';
        }
    });
</script>
</body>
</html>
