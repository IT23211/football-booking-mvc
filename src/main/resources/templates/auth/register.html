<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký Khách hàng & Xác thực OTP - Football Booking VN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/client-style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-header bg-success text-white text-center py-4">
                    <i class="bi bi-phone-vibrate-fill fs-1 text-warning"></i>
                    <h4 class="fw-bold mb-1 mt-2">ĐĂNG KÝ TÀI KHOẢN KHÁCH HÀNG</h4>
                    <p class="small mb-0 opacity-75">Xác thực mã OTP 6 số gửi về Số điện thoại Việt Nam</p>
                </div>

                <div class="card-body p-4">
                    <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center">
                        <i class="bi bi-exclamation-octagon-fill me-2 fs-5"></i>
                        <div th:text="${errorMessage}"></div>
                    </div>

                    <form th:action="@{/auth/register}" th:object="${registerForm}" method="post" novalidate>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Tên đăng nhập <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{username}" class="form-control"
                                   th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''"
                                   placeholder="Từ 4-30 ký tự chữ hoặc số (VD: nguyenvana)">
                            <div class="invalid-feedback" th:errors="*{username}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Họ và tên đầy đủ <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{fullName}" class="form-control"
                                   th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''"
                                   placeholder="Nhập họ tên người đặt sân (VD: Nguyễn Văn A)">
                            <div class="invalid-feedback" th:errors="*{fullName}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Số điện thoại Việt Nam (Nhận mã OTP) <span class="text-danger">*</span></label>
                            <input type="tel" th:field="*{phone}" class="form-control"
                                   th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''"
                                   placeholder="10 chữ số đầu 03, 05, 07, 08, 09 (VD: 0912345678)">
                            <div class="invalid-feedback" th:errors="*{phone}"></div>
                            <div class="form-text">
                                <i class="bi bi-terminal me-1"></i>Khi chạy Local (`sms.otp.mock-enabled=true`), mã OTP 6 số sẽ in trực tiếp ra cửa sổ Console của IDE.
                            </div>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Mật khẩu <span class="text-danger">*</span></label>
                                <input type="password" th:field="*{password}" class="form-control"
                                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                                       placeholder="Tối thiểu 6 ký tự">
                                <div class="invalid-feedback" th:errors="*{password}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Nhập lại mật khẩu <span class="text-danger">*</span></label>
                                <input type="password" th:field="*{confirmPassword}" class="form-control"
                                       th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''"
                                       placeholder="Xác nhận mật khẩu">
                                <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-success w-100 py-2 fw-bold">
                            <i class="bi bi-send-check-fill me-1"></i>ĐĂNG KÝ & NHẬN MÃ OTP (3 PHÚT)
                        </button>
                    </form>

                    <div class="text-center mt-3 small">
                        Đã có tài khoản?
                        <a th:href="@{/auth/login}" class="fw-bold text-success text-decoration-none">Đăng nhập tại đây</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
