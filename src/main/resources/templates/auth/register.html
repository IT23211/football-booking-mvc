<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký Khách hàng &amp; Xác thực Email OTP - Football Booking VN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/client-style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- Bố cục lớp phủ (Overlay Layout) toàn màn hình trên máy tính -->
<div class="auth-page-wrapper auth-bg-register">
    <div class="container py-4 px-3 px-md-4">
        <!-- ĐỒNG BỘ: Căn phải (justify-content-lg-end) cho cả Login và Register trên Desktop -->
        <div class="row align-items-center justify-content-center justify-content-lg-end">
            <div class="col-12 col-md-10 col-lg-7 col-xl-6 pe-lg-5">
                <!-- Bảng nhập liệu Hiện Đại (Modern White Card) -->
                <div class="card auth-glass-card mb-4">
                    <!-- Tiêu đề và badge nhận diện -->
                    <div class="card-header auth-card-header bg-transparent">
                        <div class="d-inline-flex align-items-center gap-2 px-3 py-1 rounded-pill bg-success bg-opacity-10 text-success small fw-bold mb-3">
                            <i class="bi bi-person-plus-fill"></i> Thành viên mới
                        </div>
                        <h1 class="fs-3 fw-bold auth-glass-title mb-1">
                            Đăng Ký Tài Khoản
                        </h1>
                        <div class="auth-glass-text-muted small">Kích hoạt bảo mật qua mã xác thực OTP 6 chữ số gửi về Email</div>
                    </div>

                    <!-- Form đăng ký -->
                    <form th:action="@{/auth/register}" th:object="${registerForm}" method="post" id="registerForm" novalidate>
                        <div class="card-body p-4 p-md-5 pt-4">
                            <!-- Thông báo lỗi (nếu có) -->
                            <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center mb-4 shadow-sm border-0">
                                <i class="bi bi-exclamation-octagon-fill fs-5 me-2 flex-shrink-0"></i>
                                <div class="text-break small fw-medium" th:text="${errorMessage}"></div>
                            </div>

                            <div class="row g-4">
                                <!-- Tên đăng nhập -->
                                <div class="col-12 col-md-6">
                                    <label class="form-label auth-glass-label">Tên đăng nhập <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{username}" class="form-control auth-glass-input"
                                           placeholder="Từ 4-30 ký tự" autofocus>
                                    <div class="text-danger small mt-1 fw-bold" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                                </div>

                                <!-- Họ và tên -->
                                <div class="col-12 col-md-6">
                                    <label class="form-label auth-glass-label">Họ và tên đầy đủ <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{fullName}" class="form-control auth-glass-input"
                                           placeholder="VD: Nguyễn Văn A">
                                    <div class="text-danger small mt-1 fw-bold" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                                </div>

                                <!-- Email -->
                                <div class="col-12">
                                    <label class="form-label auth-glass-label">Địa chỉ Email nhận OTP <span class="text-danger">*</span></label>
                                    <input type="email" th:field="*{email}" class="form-control auth-glass-input"
                                           placeholder="VD: nguyenvana@gmail.com">
                                    <div class="text-danger small mt-1 fw-bold" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                                    <div class="auth-glass-text-muted small mt-2 d-flex align-items-center gap-1">
                                        <i class="bi bi-info-circle text-success"></i> Mã OTP gửi về đây, hiệu lực 3 phút.
                                    </div>
                                </div>

                                <!-- Số điện thoại -->
                                <div class="col-12">
                                    <label class="form-label auth-glass-label">Số điện thoại Việt Nam <span class="text-danger">*</span></label>
                                    <input type="tel" th:field="*{phone}" class="form-control auth-glass-input" maxlength="10"
                                           placeholder="10 chữ số (VD: 0912345678)">
                                    <div class="text-danger small mt-1 fw-bold" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                                </div>

                                <!-- Mật khẩu -->
                                <div class="col-12 col-md-6">
                                    <label class="form-label auth-glass-label">Mật khẩu <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <input type="password" th:field="*{password}" id="regPassword" class="form-control auth-glass-input"
                                               placeholder="Tối thiểu 6 ký tự">
                                        <button type="button" class="btn auth-glass-input-btn toggle-pwd" data-target="regPassword">
                                            <i class="bi bi-eye"></i>
                                        </button>
                                    </div>
                                    <div class="text-danger small mt-1 fw-bold" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                                </div>

                                <!-- Xác nhận mật khẩu -->
                                <div class="col-12 col-md-6">
                                    <label class="form-label auth-glass-label">Nhập lại mật khẩu <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <input type="password" th:field="*{confirmPassword}" id="regConfirmPassword" class="form-control auth-glass-input"
                                               placeholder="Xác nhận mật khẩu">
                                        <button type="button" class="btn auth-glass-input-btn toggle-pwd" data-target="regConfirmPassword">
                                            <i class="bi bi-eye"></i>
                                        </button>
                                    </div>
                                    <div class="text-danger small mt-1 fw-bold" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                                    <div class="small mt-2 fw-bold d-none" id="passwordMatchHint"></div>
                                </div>
                            </div>
                        </div>

                        <!-- Chân Card chứa các nút hành động -->
                        <div class="card-footer auth-card-footer bg-transparent">
                            <div class="d-grid d-sm-flex gap-3 justify-content-sm-end align-items-center">
                                <a th:href="@{/auth/login}" class="text-muted text-decoration-none small fw-medium me-sm-auto mb-2 mb-sm-0">
                                    <i class="bi bi-arrow-left me-1"></i> Quay lại <span class="text-success fw-bold">Đăng nhập</span>
                                </a>
                                <button type="submit" class="btn btn-success auth-btn-primary shadow-sm" id="registerSubmitBtn">
                                    <i class="bi bi-send-check-fill me-1"></i>Đăng ký ngay
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.querySelectorAll('.toggle-pwd').forEach(function (btn) {
        btn.addEventListener('click', function () {
            const targetId = this.getAttribute('data-target');
            const input = document.getElementById(targetId);
            const icon = this.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'bi bi-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'bi bi-eye';
            }
        });
    });

    const pwd = document.getElementById('regPassword');
    const confirmPwd = document.getElementById('regConfirmPassword');
    const matchHint = document.getElementById('passwordMatchHint');

    function checkPasswordMatch() {
        if (!pwd || !confirmPwd || !matchHint) return;
        if (!confirmPwd.value) {
            matchHint.className = 'small mt-2 d-none';
            return;
        }
        if (pwd.value === confirmPwd.value) {
            matchHint.className = 'small mt-2 text-success fw-bold';
            matchHint.innerHTML = '<i class="bi bi-check-circle-fill me-1"></i>Mật khẩu xác nhận khớp';
        } else {
            matchHint.className = 'small mt-2 text-danger fw-bold';
            matchHint.innerHTML = '<i class="bi bi-exclamation-circle-fill me-1"></i>Mật khẩu xác nhận chưa khớp';
        }
    }

    pwd?.addEventListener('input', checkPasswordMatch);
    confirmPwd?.addEventListener('input', checkPasswordMatch);

    document.getElementById('registerForm')?.addEventListener('submit', function () {
        const btn = document.getElementById('registerSubmitBtn');
        if (btn) {
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Đang xử lý...';
        }
    });
</script>
</body>
</html>
