<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu &amp; Khôi phục qua Email OTP - Football Booking VN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/client-style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- Bố cục lớp phủ (Overlay Layout) toàn màn hình trên máy tính -->
<div class="auth-page-wrapper auth-bg-register">
    <div class="container py-4 px-3 px-md-4">
        <!-- ĐỒNG BỘ: Căn phải (justify-content-lg-end) cho tất cả trang Auth trên Desktop -->
        <div class="row align-items-center justify-content-center justify-content-lg-end">
            <div class="col-12 col-md-8 col-lg-6 col-xl-5 pe-lg-5">
                <!-- Bảng nhập liệu Hiện Đại (Modern White Card) -->
                <div class="card auth-glass-card mb-4">
                    <!-- Tiêu đề và badge nhận diện -->
                    <div class="card-header auth-card-header bg-transparent">
                        <div class="d-inline-flex align-items-center gap-2 px-3 py-1 rounded-pill bg-success bg-opacity-10 text-success small fw-bold mb-3">
                            <i class="bi bi-key-fill"></i> Bảo mật tài khoản
                        </div>
                        <h1 class="fs-3 fw-bold auth-glass-title mb-1">
                            Khôi Phục Mật Khẩu
                        </h1>
                        <div class="auth-glass-text-muted small">Xác thực chủ sở hữu tài khoản qua Email OTP</div>
                    </div>

                    <!-- BƯỚC 1: NHẬP EMAIL ĐỂ NHẬN MÃ OTP -->
                    <div th:if="${step != 'reset'}">
                        <form th:action="@{/auth/forgot-password}" method="post" id="forgotRequestForm">
                            <div class="card-body p-4 p-md-5 pt-4">
                                <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center mb-4 shadow-sm border-0" role="alert">
                                    <i class="bi bi-exclamation-triangle-fill fs-5 me-2 flex-shrink-0"></i>
                                    <div class="text-break small fw-medium" th:text="${errorMessage}"></div>
                                </div>

                                <div th:if="${successMessage}" class="alert alert-success d-flex align-items-center mb-4 shadow-sm border-0" role="alert">
                                    <i class="bi bi-check-circle-fill fs-5 me-2 flex-shrink-0"></i>
                                    <div class="text-break small fw-medium" th:text="${successMessage}"></div>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label auth-glass-label">Bước 1: Nhập Email của bạn <span class="text-danger">*</span></label>
                                    <input type="email" name="email" th:value="${resetPasswordForm.email}" class="form-control auth-glass-input"
                                           placeholder="Nhập Email đã đăng ký" required autofocus>
                                    <div class="auth-glass-text-muted small mt-2 d-flex align-items-center gap-1">
                                        <i class="bi bi-info-circle text-success"></i> Mã OTP 6 chữ số sẽ được gửi về đây.
                                    </div>
                                </div>
                            </div>

                            <div class="card-footer auth-card-footer bg-transparent">
                                <div class="d-grid d-sm-flex gap-3 justify-content-sm-end align-items-center">
                                    <a th:href="@{/auth/login}" class="text-muted text-decoration-none small fw-medium me-sm-auto mb-2 mb-sm-0">
                                        <i class="bi bi-arrow-left me-1"></i> Quay lại Đăng nhập
                                    </a>
                                    <button type="submit" class="btn btn-success auth-btn-primary shadow-sm" id="sendOtpBtn">
                                        <i class="bi bi-send-check-fill me-1"></i>Gửi mã OTP
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>

                    <!-- BƯỚC 2: NHẬP MÃ OTP & ĐẶT MẬT KHẨU MỚI -->
                    <div th:if="${step == 'reset'}">
                        <form th:action="@{/auth/reset-password}" th:object="${resetPasswordForm}" method="post" id="resetPasswordForm" novalidate>
                            <div class="card-body p-4 p-md-5 pt-4">
                                <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center mb-4 shadow-sm border-0" role="alert">
                                    <i class="bi bi-exclamation-triangle-fill fs-5 me-2 flex-shrink-0"></i>
                                    <div class="text-break small fw-medium" th:text="${errorMessage}"></div>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label auth-glass-label">Email tài khoản</label>
                                    <input type="email" th:field="*{email}" class="form-control auth-glass-input opacity-75" readonly>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label auth-glass-label text-success fw-bold">Mã xác thực OTP 6 chữ số <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{otpCode}" id="resetOtpInput" maxlength="6" inputmode="numeric"
                                           class="form-control auth-glass-input text-center fw-bold fs-3"
                                           placeholder="••••••" autofocus>
                                    <div class="text-danger small mt-1 fw-bold" th:if="${#fields.hasErrors('otpCode')}" th:errors="*{otpCode}"></div>
                                </div>

                                <div class="row g-4">
                                    <div class="col-12 col-md-6">
                                        <label class="form-label auth-glass-label">Mật khẩu mới <span class="text-danger">*</span></label>
                                        <div class="input-group">
                                            <input type="password" th:field="*{newPassword}" id="newPasswordInput" class="form-control auth-glass-input"
                                                   placeholder="Tối thiểu 6 ký tự">
                                            <button type="button" class="btn auth-glass-input-btn toggle-pwd" data-target="newPasswordInput">
                                                <i class="bi bi-eye"></i>
                                            </button>
                                        </div>
                                        <div class="text-danger small mt-1 fw-bold" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
                                    </div>

                                    <div class="col-12 col-md-6">
                                        <label class="form-label auth-glass-label">Xác nhận <span class="text-danger">*</span></label>
                                        <div class="input-group">
                                            <input type="password" th:field="*{confirmPassword}" id="confirmNewPasswordInput" class="form-control auth-glass-input"
                                                   placeholder="Nhập lại mật khẩu">
                                            <button type="button" class="btn auth-glass-input-btn toggle-pwd" data-target="confirmNewPasswordInput">
                                                <i class="bi bi-eye"></i>
                                            </button>
                                        </div>
                                        <div class="text-danger small mt-1 fw-bold" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                                    </div>
                                </div>
                            </div>

                            <div class="card-footer auth-card-footer bg-transparent">
                                <div class="d-grid d-sm-flex gap-3 justify-content-sm-end align-items-center">
                                    <a th:href="@{/auth/forgot-password}" class="text-muted text-decoration-none small fw-medium me-sm-auto mb-2 mb-sm-0">
                                        <i class="bi bi-arrow-clockwise me-1"></i> Đổi Email khác
                                    </a>
                                    <button type="submit" class="btn btn-success auth-btn-primary shadow-sm" id="resetSubmitBtn">
                                        <i class="bi bi-check2-circle me-1"></i>Đặt mật khẩu mới
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.querySelectorAll('.toggle-pwd').forEach(function (btn) {
        btn.addEventListener('click', function () {
            const targetId = this.getAttribute('data-target');
            const input = document.getElementById(targetId);
            const icon = this.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'bi bi-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'bi bi-eye';
            }
        });
    });

    document.getElementById('resetOtpInput')?.addEventListener('input', function () {
        this.value = this.value.replace(/[^0-9]/g, '').slice(0, 6);
    });

    document.getElementById('forgotRequestForm')?.addEventListener('submit', function () {
        const btn = document.getElementById('sendOtpBtn');
        if (btn) {
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Đang xử lý...';
        }
    });

    document.getElementById('resetPasswordForm')?.addEventListener('submit', function () {
        const btn = document.getElementById('resetSubmitBtn');
        if (btn) {
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Đang cập nhật...';
        }
    });
</script>
</body>
</html>
