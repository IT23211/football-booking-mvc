<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác thực mã OTP qua Email - Football Booking VN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/client-style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- Bố cục lớp phủ (Overlay Layout) toàn màn hình trên máy tính -->
<div class="auth-page-wrapper auth-bg-register">
    <div class="container py-4 px-3 px-md-4">
        <!-- ĐỒNG BỘ: Căn phải (justify-content-lg-end) cho tất cả trang Auth trên Desktop -->
        <div class="row align-items-center justify-content-center justify-content-lg-end">
            <div class="col-12 col-md-8 col-lg-6 col-xl-5 pe-lg-5">
                <!-- Bảng nhập liệu kính mờ siêu trong suốt (Ultra Glassmorphism Card) -->
                <div class="card auth-glass-card shadow-lg mb-4">
                    <!-- Tiêu đề và badge nhận diện -->
                    <div class="card-header bg-transparent border-bottom border-white border-opacity-10 pt-4 pb-3 px-4 px-md-5">
                        <div class="d-inline-flex align-items-center gap-2 px-3 py-1 rounded-pill bg-success bg-opacity-25 text-white small fw-semibold mb-2">
                            <i class="bi bi-shield-check text-success"></i> Xác thực bảo mật
                        </div>
                        <h1 class="fs-3 fw-bold auth-glass-title mb-1">
                            <i class="bi bi-envelope-paper-fill text-success me-1"></i>Xác Thực OTP
                        </h1>
                        <div class="auth-glass-text-muted small">Nhập mã 6 chữ số gửi về hộp thư để kích hoạt tài khoản</div>
                    </div>

                    <div class="card-body p-4 p-md-5 pt-3">
                        <div th:if="${successMessage}" class="alert alert-success bg-success bg-opacity-25 border-success border-opacity-25 text-white d-flex align-items-center mb-3 shadow-sm" role="alert">
                            <i class="bi bi-check-circle-fill fs-5 me-2 flex-shrink-0"></i>
                            <div class="text-break small fw-medium" th:text="${successMessage}"></div>
                        </div>

                        <div th:if="${errorMessage}" class="alert alert-danger bg-danger bg-opacity-25 border-danger border-opacity-25 text-white d-flex align-items-center mb-3 shadow-sm" role="alert">
                            <i class="bi bi-exclamation-triangle-fill fs-5 me-2 flex-shrink-0"></i>
                            <div class="text-break small fw-medium" th:text="${errorMessage}"></div>
                        </div>

                        <form th:action="@{/auth/verify-otp}" th:object="${otpVerifyForm}" method="post" id="verifyOtpForm" novalidate>
                            <div class="mb-3">
                                <label class="form-label auth-glass-label">Địa chỉ Email nhận OTP</label>
                                <input type="email" th:field="*{email}" class="form-control auth-glass-input opacity-75" readonly>
                                <div class="text-danger small mt-1 fw-bold" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label auth-glass-label text-success fw-bold">Nhập mã OTP 6 chữ số <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{otpCode}" id="otpCodeInput" maxlength="6" inputmode="numeric"
                                       class="form-control auth-glass-input text-center fw-bold fs-3"
                                       placeholder="••••••" autofocus>
                                <div class="text-danger small mt-1 fw-bold" th:if="${#fields.hasErrors('otpCode')}" th:errors="*{otpCode}"></div>
                                <div class="auth-glass-text-muted small mt-2 text-center">
                                    Mã OTP có hiệu lực trong 3 phút.
                                </div>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-success py-2 px-3 fw-bold shadow-sm" id="verifyOtpBtn">
                                    <i class="bi bi-check2-circle me-1"></i>Xác nhận &amp; Kích hoạt
                                </button>
                            </div>
                        </form>
                    </div>

                    <!-- Chân Card: Gửi lại mã OTP -->
                    <div class="card-footer bg-transparent border-top border-white border-opacity-10 px-4 px-md-5 py-4">
                        <form th:action="@{/auth/resend-otp}" method="post"
                              class="d-flex flex-wrap justify-content-between align-items-center gap-2 m-0">
                            <input type="hidden" name="email" th:value="${otpVerifyForm.email}">
                            <span class="small auth-glass-text-muted">Chưa nhận được mã?</span>
                            <button type="submit" class="btn btn-sm btn-outline-light border-opacity-25 py-2 px-3 fw-bold" id="resendOtpBtn">
                                <i class="bi bi-arrow-clockwise me-1"></i>Gửi lại mã OTP
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('otpCodeInput')?.addEventListener('input', function () {
        this.value = this.value.replace(/[^0-9]/g, '').slice(0, 6);
    });

    document.getElementById('verifyOtpForm')?.addEventListener('submit', function () {
        const btn = document.getElementById('verifyOtpBtn');
        if (btn) {
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Đang xác thực...';
        }
    });
</script>
</body>
</html>
