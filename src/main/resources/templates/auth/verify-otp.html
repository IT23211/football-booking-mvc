<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác thực mã OTP qua Email - Football Booking VN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/client-style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="auth-page-wrapper auth-bg-register">
    <div class="container py-4 px-3 px-md-4">
        <div class="row g-4 justify-content-center">
            <div class="col-12 col-md-8 col-lg-5">
                <div class="auth-title-box border rounded-3 shadow-sm p-3 mb-3 text-center">
                    <h1 class="fs-3 fw-bold text-dark mb-1">
                        <i class="bi bi-envelope-paper-fill text-success me-2"></i>Xác Thực Mã OTP Email
                    </h1>
                    <div class="small text-muted">Nhập mã 6 chữ số gửi về hộp thư để kích hoạt tài khoản</div>
                </div>

                <div class="card border rounded-3 shadow-sm bg-white mb-4 auth-card-smooth">
                    <div class="card-header bg-light py-3 fw-semibold">
                        <i class="bi bi-shield-check text-success me-2"></i>Nhập Mã OTP 6 Chữ Số (Hiệu lực 3 phút)
                    </div>

                    <div class="card-body p-3 p-md-4">
                        <div th:if="${successMessage}" class="alert alert-success small text-break">
                            <i class="bi bi-check-circle-fill me-1"></i>
                            <span th:text="${successMessage}"></span>
                        </div>

                        <div th:if="${errorMessage}" class="alert alert-danger small text-break">
                            <i class="bi bi-exclamation-triangle-fill me-1"></i>
                            <span th:text="${errorMessage}"></span>
                        </div>

                        <form th:action="@{/auth/verify-otp}" th:object="${otpVerifyForm}" method="post" id="verifyOtpForm" novalidate>
                            <div class="mb-3">
                                <label class="form-label fw-medium">Địa chỉ Email nhận OTP</label>
                                <input type="email" th:field="*{email}" class="form-control bg-light fw-semibold text-truncate" readonly>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-medium">Nhập mã OTP 6 chữ số <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{otpCode}" id="otpCodeInput" maxlength="6" inputmode="numeric"
                                       class="form-control text-center fw-bold fs-4"
                                       placeholder="••••••" autofocus>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('otpCode')}" th:errors="*{otpCode}"></div>
                            </div>

                            <div class="d-grid d-sm-flex gap-2 justify-content-sm-end">
                                <button type="submit" class="btn btn-success py-2 px-3 fw-semibold w-100" id="verifyOtpBtn">
                                    <i class="bi bi-check2-circle me-1"></i>Xác nhận Email &amp; Kích hoạt tài khoản
                                </button>
                            </div>
                        </form>
                    </div>

                    <div class="card-footer bg-white border-top py-3">
                        <form th:action="@{/auth/resend-otp}" method="post"
                              class="d-flex flex-wrap justify-content-between align-items-center gap-2 m-0">
                            <input type="hidden" name="email" th:value="${otpVerifyForm.email}">
                            <span class="small text-muted">Chưa nhận được mã hoặc mã hết hạn?</span>
                            <button type="submit" class="btn btn-outline-success py-2 px-3" id="resendOtpBtn">
                                <i class="bi bi-arrow-clockwise me-1"></i>Gửi lại OTP
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('otpCodeInput')?.addEventListener('input', function () {
        this.value = this.value.replace(/[^0-9]/g, '').slice(0, 6);
    });

    document.getElementById('verifyOtpForm')?.addEventListener('submit', function () {
        const btn = document.getElementById('verifyOtpBtn');
        if (btn) {
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Đang xác thực...';
        }
    });
</script>
</body>
</html>
