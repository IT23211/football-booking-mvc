<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác thực mã OTP Số điện thoại - Football Booking VN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/client-style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-header bg-dark text-white text-center py-4">
                    <i class="bi bi-shield-check fs-1 text-warning"></i>
                    <h4 class="fw-bold mb-1 mt-2">XÁC THỰC MÃ OTP (6 SỐ)</h4>
                    <p class="small mb-0 text-secondary">Mã OTP có hiệu lực trong vòng 3 phút (Caffeine Cache)</p>
                </div>

                <div class="card-body p-4">
                    <div th:if="${successMessage}" class="alert alert-success small">
                        <i class="bi bi-check-circle-fill me-1"></i>
                        <span th:text="${successMessage}"></span>
                    </div>

                    <div th:if="${errorMessage}" class="alert alert-danger small">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i>
                        <span th:text="${errorMessage}"></span>
                    </div>

                    <form th:action="@{/auth/verify-otp}" th:object="${otpVerifyForm}" method="post" novalidate>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Số điện thoại nhận OTP</label>
                            <input type="text" th:field="*{phone}" class="form-control bg-light fw-bold"
                                   th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''" readonly>
                            <div class="invalid-feedback" th:errors="*{phone}"></div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Nhập mã OTP 6 chữ số <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{otpCode}" maxlength="6"
                                   class="form-control form-control-lg text-center fw-bold fs-3 letter-spacing-2"
                                   th:classappend="${#fields.hasErrors('otpCode')} ? 'is-invalid' : ''"
                                   placeholder="••••••" autofocus>
                            <div class="invalid-feedback" th:errors="*{otpCode}"></div>
                        </div>

                        <button type="submit" class="btn btn-success w-100 py-2 fw-bold">
                            <i class="bi bi-check2-circle me-1"></i>XÁC NHẬN & KÍCH HOẠT TÀI KHOẢN
                        </button>
                    </form>

                    <hr class="my-3">

                    <form th:action="@{/auth/resend-otp}" method="post" class="text-center">
                        <input type="hidden" name="phone" th:value="${otpVerifyForm.phone}">
                        <span class="small text-muted">Chưa nhận được mã hoặc mã đã hết hạn?</span>
                        <button type="submit" class="btn btn-link btn-sm text-success fw-bold text-decoration-none">
                            <i class="bi bi-arrow-clockwise me-1"></i>Gửi lại mã OTP (Chờ 60s)
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
