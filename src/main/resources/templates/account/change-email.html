
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thay đổi Email - FBS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../../static/css/client-style.css"
          th:href="@{/css/client-style.css}" rel="stylesheet">
    <link href="../../static/css/admin-style.css"
          th:href="@{/css/admin-style.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4 py-md-5">
    <div class="mx-auto" style="max-width: 620px;">

       <a href="change-email.html"
   th:href="@{/account/change-email}"
   class="btn btn-outline-secondary mb-3">
    <i class="bi bi-arrow-left me-1"></i>
    Quay lại thay đổi Email
</a>

        <h1 class="fs-3 fw-bold mb-1">
            <i class="bi bi-envelope-at text-success me-2"></i>
            Thay đổi Email
        </h1>

        <p class="text-muted mb-4">
            Nhập Email mới và xác thực mật khẩu hiện tại.
        </p>

        <div th:if="${errorMessage}"
             th:text="${errorMessage}"
             class="alert alert-danger"
             style="display:none"
             th:style="'display:block'"></div>

        <div class="card shadow-sm">
            <div class="card-header bg-light fw-semibold py-3">
                Bước 1: Xác thực thông tin
            </div>

            <div class="card-body p-4">
                <form id="emailForm"
                      method="post"
                      action="/account/change-email/request-otp"
                      th:action="@{/account/change-email/request-otp}">

                    <div class="mb-3">
                        <label for="currentEmail" class="form-label fw-semibold">
                            Email hiện tại
                        </label>
                        <input id="currentEmail" type="email"
                               class="form-control bg-light"
                               th:value="${email}" readonly>
                    </div>

                    <div class="mb-3">
                        <label for="currentPassword" class="form-label fw-semibold">
                            Mật khẩu hiện tại *
                        </label>
                        <input id="currentPassword" name="currentPassword"
                               type="password" class="form-control"
                               autocomplete="current-password" required>
                    </div>

                    <div class="mb-4">
                        <label for="newEmail" class="form-label fw-semibold">
                            Email mới *
                        </label>
                        <input id="newEmail" name="newEmail"
                               type="email" maxlength="254"
                               class="form-control"
                               placeholder="Nhập Email mới" required>
                    </div>

                    <div id="emailNotice"
                         class="alert alert-danger d-none"
                         role="alert"></div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="profile.html"
                           th:href="@{/account}"
                           class="btn btn-outline-secondary">
                            Hủy
                        </a>

                        <button type="button"class="btn btn-success fw-semibold"
                            onclick="window.location.href='/account/change-email/verify-otp'">
                            <i class="bi bi-arrow-right-circle me-1"></i>Tiếp tục nhập OTP
                        </button>
                    </div>

                </form>
            </div>
        </div>

        <p class="small text-muted mt-3">
            Mã OTP sẽ được gửi đến Email mới sau khi hệ thống
            kiểm tra mật khẩu và tính hợp lệ của Email.
        </p>

    </div>
</main>

<script>
document.getElementById("emailForm").addEventListener("submit", function (e) {
    if (!this.reportValidity()) {
        e.preventDefault();
        return;
    }

    const currentEmail = document.getElementById("currentEmail")
        .value.trim().toLowerCase();

    const newEmail = document.getElementById("newEmail")
        .value.trim().toLowerCase();

    const notice = document.getElementById("emailNotice");

    if (currentEmail && currentEmail === newEmail) {
        e.preventDefault();
        notice.className = "alert alert-danger";
        notice.textContent = "Email mới phải khác Email hiện tại.";
        return;
    }


   // Điều hướng trong bản xem trước HTML
    if (location.pathname.endsWith(".html")) {
        e.preventDefault();
        window.location.href = "verify-otp.html";
    }

    // Khi chạy Spring Boot:
    // Backend POST /account/change-email/request-otp.
    // Chỉ redirect sang trang OTP sau khi gửi mã thành công.
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
