# ===================================================================
# 1. CẤU HÌNH SERVER & ỨNG DỤNG
# ===================================================================
spring.application.name=football-booking-mvc
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Ẩn hoàn toàn stacktrace và thông tin lỗi nhạy cảm trên giao diện
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false

# Cấu hình bảo mật Cookie Session
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ===================================================================
# 2. CẤU HÌNH CƠ SỞ DỮ LIỆU MYSQL 8.0+ / XAMPP MARIADB
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/football_booking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================================================
# 3. CẤU HÌNH THYMELEAF & UPLOAD ẢNH SÂN BÓNG
# ===================================================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.field-images-dir=src/main/resources/static/images/fields

# ===================================================================
# 4. CẤU HÌNH GMAIL SMTP & EMAIL OTP (3 PHÚT + CHỐNG SPAM 60S)
# ===================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=ptdate11@gmail.com
spring.mail.password=nzcbrzjmheddeayy
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Đặt true để chỉ in mã Email OTP 6 số ra Console IDE khi chưa điền App Password Gmail
# Đặt false để gửi Email HTML thực tế qua JavaMailSender tới hộp thư người dùng
mail.otp.mock-enabled=false
mail.otp.expiration-minutes=3
mail.otp.cooldown-seconds=60

# ===================================================================
# 5. CẤU HÌNH QUY TẮC GIỮ CHỖ 5 PHÚT & CHỐNG GIỮ CHỖ ẢO (STRIKE)
# ===================================================================
booking.hold-minutes=5
booking.max-strikes=3
booking.strike-lock-hours=24

# ===================================================================
# 6. CẤU HÌNH CỔNG THANH TOÁN VNPAY SANDBOX (THU 100% - KHÔNG HOÀN TIỀN)
