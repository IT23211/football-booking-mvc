# ===================================================================
# 1. CẤU HÌNH SERVER & ỨNG DỤNG
# ===================================================================
spring.application.name=football-booking-mvc
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Ẩn hoàn toàn stacktrace và thông tin lỗi nhạy cảm trên giao diện
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false

# Cấu hình bảo mật Cookie Session
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ===================================================================
# 2. CẤU HÌNH CƠ SỞ DỮ LIỆU MYSQL 8
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/football_booking?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===================================================================
# 3. CẤU HÌNH THYMELEAF & MULTIPART UPLOAD ẢNH SÂN BÓNG
# ===================================================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.field-images-dir=src/main/resources/static/images/fields

# ===================================================================
# 4. CẤU HÌNH SMS OTP SỐ ĐIỆN THOẠI VIỆT NAM (DEMO / MOCK & REAL API)
# ===================================================================
# Đặt true khi chạy máy Local để in mã OTP 6 số ra màn hình Console
sms.otp.mock-enabled=true
sms.otp.ttl-seconds=180
sms.otp.cooldown-seconds=60
sms.otp.api-url=https://api.speedsms.vn/index.php/sms/send
sms.otp.access-token=DEMO_SPEEDSMS_ACCESS_TOKEN_HERE
sms.otp.sender=FOOTBALL_VN

# ===================================================================
# 5. CẤU HÌNH CỔNG THANH TOÁN VNPAY SANDBOX (DEMO)
# ===================================================================
# Nếu vnpay.mock-enabled=true: Cho phép giả lập màn hình cổng thanh toán VNPay ngay trên Local
vnpay.mock-enabled=true
vnpay.tmn-code=DEMO_TMN_CODE
vnpay.hash-secret=DEMO_VNPAY_HASH_SECRET_KEY_2026_FOOTBALL_BOOKING
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=http://localhost:8080/payment/vnpay-return
vnpay.version=2.1.0
vnpay.command=pay
vnpay.order-type=billpayment

# Cấu hình VietQR Demo (Tạo mã QR chuyển khoản nhanh)
vietqr.bank-id=MB
vietqr.account-no=0987654321
vietqr.account-name=SAN BONG DA MINI VIET NAM
