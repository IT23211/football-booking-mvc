# ===================================================================
# 1. CẤU HÌNH SERVER & ỨNG DỤNG (HỖ TRỢ RAILWAY.APP & LOCAL)
# ===================================================================
spring.application.name=football-booking-mvc
server.port=${PORT:8080}
# Nhận diện đúng HTTPS & Domain thật khi chạy sau Reverse Proxy của Railway.app
server.forward-headers-strategy=framework
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Ẩn hoàn toàn stacktrace và thông tin lỗi nhạy cảm trên giao diện
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false

# Cấu hình bảo mật Cookie Session
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ===================================================================
# 2. CẤU HÌNH CƠ SỞ DỮ LIỆU MYSQL 8.0+ (TÍCH HỢP RAILWAY MYSQL & LOCAL)
# Thông tin Railway MySQL:
# - MYSQLHOST          : mysql.railway.internal
# - MYSQLPORT          : 3306
# - MYSQLDATABASE      : railway (MYSQL_DATABASE)
# - MYSQLUSER          : root
# - MYSQLPASSWORD      : UnrIVcrpJZzGkKwSuImIvrEjPlAfudmC (MYSQL_ROOT_PASSWORD)
# - MYSQL_URL          : mysql://root:UnrIVcrpJZzGkKwSuImIvrEjPlAfudmC@mysql.railway.internal:3306/railway
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:mysql.railway.internal}:${MYSQLPORT:3306}/${MYSQLDATABASE:${MYSQL_DATABASE:railway}}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:${MYSQL_ROOT_PASSWORD:UnrIVcrpJZzGkKwSuImIvrEjPlAfudmC}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cấu hình HikariCP tối ưu cho môi trường Cloud (Railway)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================================================
# 3. CẤU HÌNH THYMELEAF & UPLOAD ẢNH SÂN BÓNG
# ===================================================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.field-images-dir=${APP_UPLOAD_DIR:src/main/resources/static/images/fields}

# ===================================================================
# 4. CẤU HÌNH GMAIL SMTP & EMAIL OTP (3 PHÚT + CHỐNG SPAM 60S)
# ===================================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:ptdate11@gmail.com}
spring.mail.password=${MAIL_PASSWORD:nzcbrzjmheddeayy}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Đặt true để chỉ in mã Email OTP 6 số ra Console khi chưa điền App Password Gmail
# Đặt false để gửi Email HTML thực tế qua JavaMailSender tới hộp thư người dùng
mail.otp.mock-enabled=${MAIL_OTP_MOCK_ENABLED:false}
mail.otp.expiration-minutes=3
mail.otp.cooldown-seconds=60

# ===================================================================
# 5. CẤU HÌNH QUY TẮC GIỮ CHỖ 5 PHÚT & CHỐNG GIỮ CHỖ ẢO (STRIKE)
# ===================================================================
booking.hold-minutes=5
booking.max-strikes=3
booking.strike-lock-hours=24

